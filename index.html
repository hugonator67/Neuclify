<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neuclify</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a control-room console. Fixed HUD strip, pixel viewport on the left, operator panel on the right,
   teleprinter log along the bottom. Single dark theme by design — this is a CRT in a reactor hall. */
:root{
  --void:#070a0c; --panel:#10161b; --panel2:#161f26; --bezel:#243039; --bezel2:#364754;
  --ink:#cfe6dc; --dim:#7d9389; --line:#1e2a32;
  --green:#5ef08a; --amber:#ffb23a; --red:#ff4b45; --blue:#56b7ff; --cyan:#7cf3ff; --violet:#b07cff;
  --ui:'Press Start 2P',ui-monospace,monospace; --rd:'VT323',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--rd);font-size:19px;overflow:hidden}
button{font-family:var(--ui);color:var(--ink);background:var(--panel2);border:2px solid var(--bezel2);
  border-radius:0;padding:7px 8px;font-size:8px;line-height:1.5;cursor:pointer;letter-spacing:.5px;
  box-shadow:inset -2px -2px 0 #0006, inset 2px 2px 0 #ffffff14}
button:hover:not(:disabled){background:#1e2b34;border-color:var(--green)}
button:active:not(:disabled){box-shadow:inset 2px 2px 0 #0008;transform:translate(1px,1px)}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.b-go{border-color:#2e6b45;background:#13281c;color:var(--green)}
.b-warn{border-color:#6b5420;background:#2a2112;color:var(--amber)}
.b-bad{border-color:#6b2a28;background:#2a1312;color:var(--red)}
.wide{width:100%}

#app{height:100%;display:flex;flex-direction:column;min-height:0}

#hud{display:flex;align-items:center;gap:10px;background:linear-gradient(#182229,#0d1318);
  border-bottom:2px solid var(--bezel);padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  flex:0 0 auto;overflow:hidden}
.brand{font-family:var(--ui);font-size:13px;color:var(--green);text-shadow:0 0 8px #5ef08a66;letter-spacing:1px;white-space:nowrap}
.brand b{color:var(--amber)}
.brand small{display:block;font-size:6px;color:var(--dim);text-shadow:none;letter-spacing:.5px;margin-top:4px;white-space:nowrap}
.cap{color:var(--dim);font-size:15px;line-height:1.15;margin:-3px 0 7px}
#stats{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#stats::-webkit-scrollbar{display:none}
.st{background:#0b1116;border:1px solid var(--line);padding:1px 7px 2px;min-width:0;white-space:nowrap;flex:0 0 auto}
.st i{display:block;font-family:var(--ui);font-size:6px;color:var(--dim);font-style:normal;letter-spacing:.5px}
.st b{font-weight:400;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.hudbtn{display:flex;gap:3px;flex:0 0 auto}
.hudbtn button{padding:6px 6px;font-size:7px}

#main{flex:1 1 auto;display:flex;min-height:0}
#stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#05080a}
#canwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#04070a;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
canvas{image-rendering:pixelated;width:100%;height:100%;object-fit:contain;display:block}
#scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,#0000 0 2px,#00000030 2px 4px)}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #000a}
#flash{position:absolute;inset:0;pointer-events:none;background:#ff4b45;opacity:0;transition:opacity .22s}
#alarmband{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;
  padding:4px;pointer-events:none}
.alm{font-family:var(--ui);font-size:7px;padding:3px 5px;border:1px solid currentColor;background:#000000b8}
.alm.r{color:var(--red)}.alm.a{color:var(--amber)}.alm.b{color:var(--blue)}
.blink{animation:bl .7s steps(2,end) infinite}
@keyframes bl{50%{opacity:.22}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

#tabs{display:flex;gap:2px;padding-block:4px;background:#0b1015;border-top:2px solid var(--bezel);
  overflow-x:auto;flex:0 0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tabs button{flex:1 1 auto;white-space:nowrap;font-size:7px;padding:8px 4px}
#tabs button.on{background:#17352a;border-color:var(--green);color:var(--green)}

#panel{flex:0 0 340px;background:var(--panel);border-left:2px solid var(--bezel);overflow-y:auto;
  padding-block:8px;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel::-webkit-scrollbar{width:9px}
#panel::-webkit-scrollbar-thumb{background:var(--bezel2)}
#panel::-webkit-scrollbar-track{background:#0a0f13}

.box{border:2px solid var(--bezel);background:var(--panel2);padding:7px}
.box>h3{font-family:var(--ui);font-size:8px;margin:0 0 7px;color:var(--amber);letter-spacing:.5px;
  display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.box>h3 em{font-family:var(--rd);font-size:17px;color:var(--dim);letter-spacing:0;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.25}
.row+.row{margin-top:2px}
.row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.k{color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:#070c0e;border:1px solid var(--line);margin:3px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);
  background-image:repeating-linear-gradient(90deg,#ffffff22 0 2px,#0000 2px 4px)}
.bar.sm{height:6px;margin:2px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid4 button{padding:7px 2px}
.seg{display:flex;gap:2px;position:sticky;top:-8px;z-index:2;background:var(--panel);padding-block:4px}
.seg button{flex:1 1 0;font-size:7px;padding:8px 2px}
.seg button.on{background:#17352a;border-color:var(--green);color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:3px}
.tile{position:relative;overflow:hidden;font-family:var(--rd);font-size:15px;padding:3px 0;background:#0a1013;
  border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.tile i{position:absolute;left:0;bottom:0;width:100%;opacity:.28}
.tile span{position:relative}
.tile:disabled{opacity:1;cursor:default}
.tile:not(:disabled){border-color:var(--red);cursor:pointer}
button.quiet{background:transparent;border-color:var(--line);color:var(--dim);box-shadow:none;margin-top:4px}
.slide .k{flex:0 0 58px;font-size:17px}
.slide{display:flex;align-items:center;gap:6px}
.slide b{font-weight:400;flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1 1 auto;min-width:0;height:18px;-webkit-appearance:none;appearance:none;background:#070c0e;
  border:1px solid var(--line);margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;background:var(--amber);
  border:1px solid #000;cursor:ew-resize}
input[type=range]::-moz-range-thumb{width:12px;height:16px;border-radius:0;background:var(--amber);border:1px solid #000;cursor:ew-resize}
.tag{font-family:var(--ui);font-size:6px;padding:2px 4px;border:1px solid currentColor;white-space:nowrap}
.fsw{display:flex;gap:2px;margin-top:5px}
.fsw button{flex:1 1 0;font-size:7px;padding:7px 2px}
.fsw button.on.m-main{background:#17352a;border-color:var(--green);color:var(--green)}
.fsw button.on.m-edg{background:#3a2c10;border-color:var(--amber);color:var(--amber)}
.fsw button.on.m-off{background:#3a1614;border-color:var(--red);color:var(--red)}
.t-on{color:var(--green)}.t-off{color:var(--dim)}.t-bad{color:var(--red)}.t-warn{color:var(--amber)}
.item{border:1px solid var(--line);background:#0c1317;padding:5px;margin-bottom:5px}
.item:last-child{margin-bottom:0}
.item .nm{font-family:var(--ui);font-size:7px;letter-spacing:.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.muted{color:var(--dim)}
.cost{color:var(--amber)}
.hint{color:var(--dim);font-size:16px;line-height:1.3}
.no{color:var(--dim);text-align:center;padding:6px 0}

#ticker{flex:0 0 auto;background:#070b0e;border-top:2px solid var(--bezel);height:28px;overflow:hidden;
  display:flex;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tickertext{white-space:nowrap;color:var(--dim);font-size:18px;overflow:hidden;text-overflow:ellipsis}
#tickertext b{font-weight:400;color:var(--ink)}
.e-bad{color:var(--red)}.e-warn{color:var(--amber)}.e-good{color:var(--green)}.e-info{color:var(--blue)}

.ov{position:fixed;inset:0;background:#04060cf0;display:none;align-items:center;justify-content:center;z-index:40;
  padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.ov.show{display:flex}
.card{max-width:660px;width:100%;border:3px solid var(--bezel2);background:linear-gradient(#131c22,#0a1014);
  padding:18px;box-shadow:0 0 0 3px #000, 0 10px 40px #000a;max-height:100%;overflow-y:auto}
.card h1{font-family:var(--ui);font-size:24px;margin:0 0 6px;color:var(--green);text-shadow:0 0 14px #5ef08a55;line-height:1.35;text-wrap:balance}
.card h1.bad{color:var(--red);text-shadow:0 0 14px #ff4b4555}
.card h2{font-family:var(--ui);font-size:9px;margin:16px 0 6px;color:var(--amber);letter-spacing:.5px}
.card p{margin:6px 0;line-height:1.35;max-width:64ch}
.card .sub{color:var(--dim);font-family:var(--ui);font-size:8px;line-height:1.9}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline}
.keys b{font-family:var(--ui);font-size:7px;color:var(--cyan);font-weight:400}
.setrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.setrow label{flex:0 0 150px;color:var(--dim)}
.setrow input[type=range]{flex:1 1 auto;height:20px}
.setrow b{flex:0 0 36px;text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
.setrow button{flex:0 0 56px}
@media (max-width:520px){.setrow label{flex-basis:96px}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts button{font-size:10px;padding:11px 14px}
.final{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;margin-top:8px}
.final div{border:1px solid var(--line);background:#0b1116;padding:5px 7px}
.final i{display:block;font-family:var(--ui);font-size:6px;color:var(--dim);font-style:normal}
.final b{font-weight:400;font-size:21px}

.narrowonly{display:none}
@media (max-width:860px), (max-aspect-ratio:1/1){
  .narrowonly{display:block}
  #main{flex-direction:column}
  #panel{flex:1 1 auto;border-left:0;border-top:2px solid var(--bezel);min-height:0;flex-basis:auto}
  #canwrap{flex:0 0 auto;aspect-ratio:16/9;max-height:40vh;width:100%}
  .brand{font-size:10px}
}
@media (max-width:520px){
  .st b{font-size:18px}
  .card h1{font-size:17px}
}
</style>

<div id="app">
  <header id="hud">
    <div class="brand">NEUCL<b>I</b>FY<small id="stageLbl"></small></div>
    <div id="stats"></div>
    <div class="hudbtn">
      <button id="bSpeed" title="Simulation speed">1x</button>
      <button id="bPause" title="Pause (Space)">II</button>
      <button id="bSet" title="Settings (O)">SET</button>
      <button id="bHelp" title="Manual (H)">?</button>
    </div>
  </header>
  <main id="main">
    <section id="stage">
      <div id="canwrap">
        <canvas id="cv" width="480" height="270" aria-label="Plant view"></canvas>
        <div id="scan"></div><div id="vignette"></div><div id="flash"></div>
        <div id="alarmband"></div>
      </div>
      <nav id="tabs"></nav>
    </section>
    <aside id="panel"></aside>
  </main>
  <footer id="ticker"><span id="tickertext">Welcome to Neuclify.</span></footer>
</div>
<div class="ov" id="ov"><div class="card" id="ovcard"></div></div>

<script>
(function(){
'use strict';

/* ============================ 0. SMALL TOOLS ============================ */
let VW=480, VH=270;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;

function money(n){
  const s=n<0?'-':''; n=Math.abs(n);
  if(n>=1e12) return s+'$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9) return s+'$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return s+'$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e4) return s+'$'+Math.round(n/1e3)+'k';
  return s+'$'+(n<100?n.toFixed(0):Math.round(n).toLocaleString('en-US'));
}
function mw(n){
  if(n>=1000) return (n/1000).toFixed(n>=10000?0:2)+' GW';
  if(n>=1) return n.toFixed(n>=100?0:1)+' MW';
  return (n*1000).toFixed(n>=0.1?0:1)+' kW';
}
function num(n,d){return n.toFixed(d===undefined?0:d)}

/* pixel plotting ------------------------------------------------------- */
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0))}
function rect(x,y,w,h,c){ // 1px outline
  px(x,y,w,1,c);px(x,y+h-1,w,1,c);px(x,y,1,h,c);px(x+w-1,y,1,h,c);
}
function panelBox(x,y,w,h,fill,edge,edge2){
  px(x,y,w,h,fill); rect(x,y,w,h,edge);
  px(x+1,y+1,w-2,1,edge2||edge); px(x+1,y+1,1,h-2,edge2||edge);
}
const FONT={
'0':'111101101101111','1':'010010010010010','2':'111001111100111','3':'111001111001111','4':'101101111001001',
'5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111',
'A':'111101111101101','B':'111101110101111','C':'111100100100111','D':'110101101101110','E':'111100111100111',
'F':'111100111100100','G':'111100101101111','H':'101101111101101','I':'111010010010111','J':'001001001101111',
'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'110101101101101','O':'111101101101111',
'P':'111101111100100','Q':'111101101111011','R':'111101110101101','S':'111100111001111','T':'111010010010010',
'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101111010010',
'Z':'111001010100111','.':'000000000000010',':':'000010000010000','-':'000000111000000','/':'001001010100100',
'%':'101001010100101',' ':'000000000000000','+':'000010111010000','!':'010010010000010','?':'111001010000010',
'#':'101111101111101','(':'010100100100010',')':'010001001001010',',':'000000000010010','*':'101010101000000',
'>':'100010001010100','<':'001010100010001','=':'000111000111000','$':'111110111011111',"'":'010010000000000'
};
function text(s,x,y,c,sc){
  sc=sc||1; s=(''+s).toUpperCase(); let cx=x;
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]; if(g===undefined){cx+=4*sc;continue}
    for(let r=0;r<5;r++)for(let k=0;k<3;k++)
      if(g[r*3+k]==='1') px(cx+k*sc,y+r*sc,sc,sc,c);
    cx+=4*sc;
  }
  return cx;
}
function textW(s,sc){return (''+s).length*4*(sc||1)}
function textC(s,cx,y,c,sc){return text(s,cx-textW(s,sc)/2|0,y,c,sc)}

/* palette -------------------------------------------------------------- */
const P={
  black:'#05080a', dark:'#0c1216', night:'#111a2a', steel:'#2b3540', steel2:'#3d4b59', steel3:'#55687a',
  pale:'#8ea2b3', white:'#dff0f6', ink:'#cfe6dc',
  green:'#5ef08a', green2:'#2e9b5c', amber:'#ffb23a', amber2:'#a66f18', red:'#ff4b45', red2:'#9e2420',
  blue:'#56b7ff', blue2:'#1f5f96', cyan:'#7cf3ff', violet:'#b07cff', yellow:'#ffe66d',
  grass:'#2c5338', grass2:'#1d3826', dirt:'#4a3a2c', rust:'#8a5a3c', concrete:'#4e5a66', concrete2:'#39434d',
  water:'#1d4f6b', glow:'#9cffd0'
};
function heatColor(t){
  if(t<200) return '#2b4a63'; if(t<380) return '#2f6b7a';
  if(t<560) return '#5a8a4a'; if(t<720) return '#b8a63a';
  if(t<900) return '#e8832a'; if(t<1100) return '#ff5a22';
  if(t<1500) return '#ff2a18'; return '#fff0a0';
}

/* ============================ 1. GAME DATA ============================ */
const TIERS=[
 {id:'house', name:'Your House',        demand:0.006, rate:960, cost:0,      rep:0,  w:'1 house'},
 {id:'street',name:'Larkspur Street',   demand:0.085, rate:620, cost:1200,   rep:18, w:'14 houses'},
 {id:'villg', name:'Pinebrook Village', demand:1.3,   rate:370, cost:11000,  rep:28, w:'340 homes'},
 {id:'town',  name:'Ashford Town',      demand:16,    rate:225, cost:70000,  rep:38, w:'9,000 people'},
 {id:'city',  name:'Harbour City',      demand:135,   rate:148, cost:420000, rep:46, w:'210,000 people'},
 {id:'metro', name:'Metro Steel Belt',  demand:480,   rate:114, cost:2.3e6,  rep:54, w:'heavy industry'},
 {id:'regn',  name:'Calder Region',     demand:1400,  rate:92,  cost:1.2e7,  rep:62, w:'4 million people'},
 {id:'natn',  name:'The Nation',        demand:4800,  rate:78,  cost:6.5e7,  rep:70, w:'31 million people'},
 {id:'cont',  name:'The Continent',     demand:16500, rate:66,  cost:3.4e8,  rep:78, w:'9 countries'},
 {id:'world', name:'The World',         demand:62000, rate:58,  cost:1.9e9,  rep:88, w:'everyone'}
];

const TURBS=[
 {name:'TG-1 Kettle',     cap:14,    cost:2600},
 {name:'TG-2 Condensing', cap:65,    cost:19000},
 {name:'TG-3 Tandem',     cap:340,   cost:150000},
 {name:'TG-4 Compound',   cap:1250,  cost:950000},
 {name:'TG-5 Supercrit',  cap:4800,  cost:5.8e6},
 {name:'TG-6 Monolith',   cap:17000, cost:3.6e7}
];

const GOODS=[
 {id:'fuel',   name:'Fuel Assemblies', unit:'assy',  price:430, pack:2,  eta:16, cap:40},
 {id:'coolant',name:'Makeup Water',    unit:'kL',    price:24,  pack:20, eta:9,  cap:400},
 {id:'food',   name:'Canteen Supply',  unit:'crate', price:36,  pack:10, eta:7,  cap:300},
 {id:'parts',  name:'Spare Parts',     unit:'kit',   price:185, pack:4,  eta:11, cap:120}
];

/* upgrade tree: lv = number owned, vals[lv] is the current effect value */
const UPG=[
 {id:'core', name:'Core Expansion', cat:'Reactor', unit:' slots',
  vals:[4,6,10,16,24,36,52,72,100,132], costs:[0,3200,16000,92000,520000,2.6e6,1.3e7,7e7,3.6e8,1.9e9],
  desc:'Fuel positions in the pressure vessel. More assemblies, more thermal power.'},
 {id:'fuel', name:'Fuel Enrichment', cat:'Reactor', unit:' MWt/assy',
  vals:[8,16,34,70,150,320,650,1200,2000], costs:[0,4800,24000,130000,700000,3.4e6,1.7e7,9e7,4.4e8],
  desc:'Hotter fuel per position. Raises burn-up rate and assembly price too.'},
 {id:'loops',name:'Coolant Loops', cat:'Reactor', unit:' loops',
  vals:[1,2,3,4,5,6], costs:[0,2200,14000,110000,900000,7e6],

/* derived values -------------------------------------------------------- */
const U=id=>UPGBY[id].vals[S.up[id]];
const upMax=id=>S.up[id]>=UPGBY[id].vals.length-1;
const upCost=id=>upMax(id)?Infinity:Math.round(UPGBY[id].costs[S.up[id]+1]*COSTX);
function pumpCap(){ // MW of heat removal available at 100% on all healthy loops
  let c=0; const per=U('pumpt'), n=U('loops');
  for(let i=0;i<n;i++) c+=per*(S.pumps[i].h/100);
  return c;
}
function pumpFlow(){ // 0..1 weighted actual flow
  let f=0, n=U('loops'), per=U('pumpt'), tot=per*n||1;
  for(let i=0;i<n;i++) f+=per*(S.pumps[i].s/100)*(S.pumps[i].h/100);
  return f/tot;
}
/* heat removal the loops can reach at the current pump setting, once the core is hot enough */
function coolCap(){ return (pumpFlow()*pumpCap()+coreThermalMax()*0.04)*1.6 }
/* the same with every pump wide open — the plant's physical ceiling */
function removalCap(){ return (pumpCap()+coreThermalMax()*0.04)*1.6 }
/* where the core temperature will settle at the present power and flow */
function settleTemp(){
  const c=pumpFlow()*pumpCap()+coreThermalMax()*0.04;
  if(c<=0.0001) return 2600;
  return Math.min(2600,S.r.inlet+700*thermalNow()/c);
}

function coreThermalMax(){
  let m=0;

/* Each customer hangs off its own feeder bay in the switchyard. A feeder is fed from MAIN (the
   station, through the switchyard), from BACKUP (islanded onto the site's diesel generators),

const FMODES=['main','edg','off'], DIESEL_PRICE=300;
function demProf(){
  let p=0.78+0.34*Math.sin((S.hours-7.5)/24*Math.PI*2)+0.08*Math.sin(S.hours/24*Math.PI*6);
  for(const e of S.ev.active) if(e.demandMul) p*=e.demandMul;

}

function feederDem(i){ return S.grid.on[i]?TIERS[i].demand*demProf():0 }

function demandNow(){ let d=0; for(let i=0;i<10;i++) if(feedMode(i)!=='off') d+=feederDem(i); return d }

function edgSetMW(){ return Math.max(0.05,coreThermalMax()*0.025) }
function edgCap(){ return auxState().edgs*edgSetMW() }
function setFeeder(i,m){
  if(!S.grid.on[i]||FMODES.indexOf(m)<0||feedMode(i)===m) return;
  if(m==='edg'&&!auxState().edgs){ logMsg('No backup generators fitted — buy diesels on the Grid page first.','warn'); return }
  S.grid.fd[i]=m;
  const T=TIERS[i];
  logMsg(m==='main'?T.name+' feeder closed onto the switchyard.':
         m==='edg'?T.name+' islanded onto the backup diesels.':
         T.name+' feeder breaker opened. Planned outage announced.',m==='off'?'warn':'info');
  beep(m==='off'?330:660,0.06);
}
function rateNow(){
  let d=0,r=0;
  TIERS.forEach((T,i)=>{ if(S.grid.on[i]){d+=T.demand; r+=T.demand*T.rate} });
  return d>0? r/d : 0;

/* ============================ 3. SIMULATION ============================ */
const HPS=0.3;              // in-game hours per real second at 1x  (1 day = 80 s)

function step(dt){
  if(S.over) return;
  const T=dt*S.speed;       // plant-seconds
  const H=T*HPS;            // in-game hours
  S.t+=T;
  S.hours+=H;
  while(S.hours>=24){ S.hours-=24; S.day++; S.st.days++; newDay(); }
  stepReactor(T,H);
  stepPlant(T,H);
  stepGrid(T,H);
  stepMoney(H);
  stepLogistics(H);
  stepJobs(H);
  stepEvents(T,H);
  stepDamage(T,H);
  S.flash=Math.max(0,S.flash-dt*2.2);
  S.shake=Math.max(0,S.shake-dt*2.6);
}

function newDay(){
  const need=crewCount();
  const fed=S.inv.food>=need;
  if(fed) S.inv.food-=need; else S.inv.food=0;
  if(!fed&&need>0) logMsg('The canteen came up short today. The crew noticed.','warn');
  for(const w of S.crew.workers){
    w.days++;
    w.mood=clamp(w.mood+(fed?4:-18)+(w.duty==='rest'?3:0)+(TRAITBY[w.trait].mood||0)*2,0,100);
    if(w.mood<18&&chance(0.5)){
      logMsg(wName(w)+' has handed in their notice and walked off site.','bad');
      S.crew.workers=S.crew.workers.filter(x=>x.id!==w.id);
    } else if(w.mood<34&&chance(0.3)) logMsg(wName(w)+' is talking about leaving. Feed them and give them a rest day.','warn');
  }
}
/* repair throughput: nothing happens on the board without maintenance staff */
function skill(){ return S.crew.strike>0?0:clamp(0.18+dutyPower('maint')*0.16,0,6) }
/* unloading throughput at the gate, in units per hour */
function yardRate(){ return S.crew.strike>0?0.1:0.25+dutyPower('yard')*1.25 }

function stepReactor(T,H){
  const r=S.r;
  if(r.jam>0) r.jam-=T;
  if(r.scramT>0){ r.rods=100; r.scramT-=T; }
  // reactivity balance
  let burn=0,n=0; for(const a of S.core) if(a.on&&a.burn<100){burn+=a.burn;n++}
  const avgBurn=n?burn/n:0;
  // rods add reactivity; fuel temperature (Doppler) removes it instantly with power, which is what
  // makes the core self-regulating. Coolant temperature trims it slowly. Xenon and burn-up eat into it.
  let rho=0.12*(1-r.rods/100)-0.0108-r.flux*0.00075-(r.temp-290)*0.00004
          -r.xe*0.00034-(avgBurn/100)*0.02;
  for(const e of S.ev.active) if(e.rho) rho+=e.rho;
  if(n===0) rho=-1;
  r.flux+=(r.flux*rho*3+0.05*(1-r.rods/100)*(n?1:0))*T;
  r.flux=clamp(r.flux,0,160);
  // decay heat: fission products keep making heat long after the chain reaction stops
  r.decay+=((r.flux/100)*0.07-r.decay)*0.02*T;

  // heat balance — forced flow from the pumps plus a little natural circulation
  const thermal=thermalNow();
  let forced=pumpFlow()*pumpCap();
  for(const e of S.ev.active) if(e.coolMul) forced*=e.coolMul;   // events hit the pumps, not physics
  // pumps need power: on the diesels only the safety bus runs; with nothing, they coast down
  const ax=auxState();
  if(ax.src==='EDG') forced*=U('diesel')/100; else if(ax.src==='NONE') forced*=0.08;
  let cool=(forced+coreThermalMax()*0.04)*clamp((r.temp-r.inlet)/700,0,1.6);
  if(r.coolant<=0.5) cool*=0.06; else if(r.coolant<35) cool*=0.45+0.55*(r.coolant/35);
  const mass=Math.max(4,coreThermalMax()*0.45);
  r.temp+=(thermal-cool)/mass*T;
  r.temp=clamp(r.temp,r.inlet,2600);
  S.out.thermal=thermal; S.out.cool=cool;
  S.st.maxTemp=Math.max(S.st.maxTemp,r.temp);

  // pressure
  let pt=1+Math.max(0,r.temp-95)*0.16;
  if(r.vent>0) pt*=0.5;
  if(r.coolant<20) pt*=0.4+0.03*r.coolant;
  r.press+=(pt-r.press)*clamp(0.5*T,0,1);
  r.press=Math.max(0.6,r.press);

  // reactor protection system — drops the rods before an overshoot becomes a wreck.
  // It cannot save a core with nothing carrying the decay heat away.
  if(r.rods<98&&(r.temp>1150||r.press>pressLimit()*1.04))
    scram(r.temp>1150?'high core temperature':'high vessel pressure');

  // xenon / iodine
  r.iod+=(r.flux*0.01-r.iod*0.004)*T;
  r.xe+=(r.iod*0.004-r.xe*(0.005+r.flux*0.0012))*T;
  r.iod=Math.max(0,r.iod); r.xe=Math.max(0,r.xe);

  // coolant inventory
  r.coolant-=(0.02+r.flux/100*0.06)*H;
  if(r.leak>0) r.coolant-=r.leak*T;
  if(r.vent>0){ r.coolant-=0.35*T; S.rep=clamp(S.rep-0.5*T*(1-U('scrub')/100),0,100); }
  r.coolant=clamp(r.coolant,0,100);
  if(S.up.makeup>0 && r.coolant<88 && S.inv.coolant>0){
    const want=Math.min(88-r.coolant, S.inv.coolant, 14*H);
    r.coolant+=want; S.inv.coolant-=want;
  }
  // burn-up
  if(r.flux>1){
    const rate=r.flux/100*0.16*H;
    for(const a of S.core) if(a.on&&a.burn<100){
      const was=a.burn;
      a.burn=Math.min(100,a.burn+rate);
      if(was<86&&a.burn>=86) logMsg('Fuel assemblies are nearly spent. Order replacements and plan a shutdown.','warn');
      if(a.burn>=100) logMsg('A fuel assembly is spent. Replace it in the Reactor Core view.','warn');
    }
  }
  if(r.noise>0) r.noise-=H;
}
function thermalNow(){ return (S.r.flux/100+(S.r.decay||0))*coreThermalMax(); }

/* Auxiliary power. While the unit generates, its own house loads (coolant pumps, feed
   pumps, ventilation) run off the unit auxiliary transformer. Shut down, they come off
   the station service transformer, fed from the grid — and that power is bought. Lose
   offsite power while shut down and only the emergency diesels keep the safety bus alive. */
const IMPORT_PRICE=95;                       // $/MWh paid for house load drawn from the grid
function auxState(){
  const gen=S.out.gross>0.0005;
  const offsite=S.grid.trip<=0&&S.grid.lineH>0&&!evActive('blackout');
  const edgs=[0,1,2,3][S.up.diesel]||0;
  const src=gen?'UAT':offsite?'SST':edgs>0?'EDG':'NONE';
  return {gen,offsite,edgs,src,run:src==='EDG'||(S.out.bk||0)>0};
}

/* The station grows with the business: each stage adds units, cooling towers and a
   bigger switchyard to every exterior view, and a better-equipped control room. */
const STAGES=['PILOT PLANT','STREET STATION','DISTRICT STATION','GENERATING STATION','POWER COMPLEX','GLOBAL ENERGY COMPLEX'];
function plantStage(){
  let up=0; for(const k in S.up) up+=S.up[k];
  const t=tiersOn();
  const byT=t>=9?5:t>=7?4:t>=5?3:t>=3?2:t>=2?1:0;
  return Math.max(byT,Math.min(5,Math.floor(up/9)));
}
function siteUnits(st){ return st>=5?4:st>=4?3:st>=3?2:1 }

function stepPlant(T,H){
  // turbine spin + wear
  const grossCap=turbCap();
  for(const t of S.turbs){
    const want=t.on&&S.out.gross>0?1:0;
    t.spin=lerp(t.spin,want,clamp(T*1.5,0,1));
    if(t.on&&S.out.gross>0.01){
      t.h=Math.max(0,t.h-(0.0045+(S.out.gross/Math.max(1,grossCap))*0.012)*H);
      if(t.h<=0){ t.on=false; t.h=0; logMsg('Turbine '+TURBS[t.m].name+' has seized. It needs a full overhaul.','bad'); S.flash=0.6; }
    }
  }
  // pump wear
  const n=U('loops');
  for(let i=0;i<n;i++){ const p=S.pumps[i];
    if(p.s>2&&p.h>0){ p.h=Math.max(0,p.h-(0.004+p.s/100*0.01)*H);
      if(p.h<=0) logMsg('Coolant pump '+(i+1)+' has failed. Heat removal is reduced.','bad'); }
  }
  // crew fatigue, morale and the recruitment board
  if(S.crew.strike>0) S.crew.strike-=H;
  for(const w of S.crew.workers){
    if(w.duty==='rest') w.fat=Math.max(0,w.fat-(1.8+w.stam*0.12)*H);
    else w.fat=Math.min(100,w.fat+(0.62-w.stam*0.028)*H);
    if(w.fat>80) w.mood=clamp(w.mood-0.09*H,0,100);
    else if(w.duty==='rest') w.mood=clamp(w.mood+0.05*H,0,100);
    if(S.inv.food<=0) w.mood=clamp(w.mood-0.1*H,0,100);
  }
  S.crew.poolT-=H;
  if(S.crew.poolT<=0) refreshPool();
  if(crewCount()&&avgMood()<30&&S.crew.strike<=0&&chance(0.012*H)) fireEvent('strike');
}

function stepGrid(T,H){
  const o=S.out, g=S.grid;
  let gross=S.out.thermal*(U('turbe')/100);
  gross=Math.min(gross,turbCap());
  for(const e of S.ev.active) if(e.genMul) gross*=e.genMul;
  const parasite=o.cool*0.021+(coreThermalMax()>0?0.05:0);
  o.gross=gross; o.parasite=parasite;
  o.net=Math.max(0,gross-parasite);
  const cap=U('line')*(g.lineH>0?1:0)*(g.trip>0?0:1);
  o.cap=cap;
  // the switchyard only accepts what the wires can carry; the rest is bypassed to the condenser
  let thru=Math.min(o.net,cap);
  o.bypass=Math.max(0,o.net-thru);
  if(g.lineH<100&&S.crew.strike<=0) g.lineH=Math.min(100,g.lineH+0.4*H*skill());
  if(g.trip>0){ g.trip-=H; if(g.trip<=0){ g.lineH=Math.max(35,g.lineH); logMsg('Main line re-energised.','good'); } }

  const deliv=thru*(1-U('hv')/100);
  // share the power out feeder by feeder. Short of power, the switchyard holds the oldest
  // contracts and sheds from the newest end; the diesels carry the safety bus before any customer.
  const ax=auxState();
  let mainLeft=deliv, bkLeft=Math.max(0,edgCap()-(ax.src==='EDG'?o.parasite:0));
  let dem=0, mainDem=0, conDem=0, offDem=0, mainS=0, bk=0, bkDem=0, rev=0;
  const fs=o.fs||(o.fs=[]);
  for(let i=0;i<10;i++){
    const d=feederDem(i), m=feedMode(i); let s=0;
    conDem+=d;
    if(m==='main'){ s=Math.min(d,mainLeft); mainLeft-=s; mainS+=s; mainDem+=d; dem+=d }
    else if(m==='edg'){ s=Math.min(d,bkLeft); bkLeft-=s; bk+=s; bkDem+=d; dem+=d }
    else offDem+=d;
    fs[i]=s; rev+=s*TIERS[i].rate;
  }
  o.demand=dem; o.deliv=deliv; o.mainS=mainS; o.bk=bk; o.bkDem=bkDem; o.rev=rev;
  o.served=mainS+bk;
  o.spill=Math.max(0,mainLeft);
  o.dsl=(bk+(ax.src==='EDG'?Math.min(o.parasite,edgCap()):0))*DIESEL_PRICE;
  // cold start: the network is not yet relying on you, so nothing is held against the plant
  if(S.startup){
    g.sat=100;
    if(mainS>0&&mainS>=mainDem*0.98&&startupDone()){
      S.startup=false;
      logMsg('Synchronised to the grid. The house is on your power — from here the network is counting.','good');
      beep(880,0.14);
    }
  } else {
    // a planned outage is resented, but much less than a blackout nobody warned them about
    const target=conDem>0?clamp((o.served+offDem*0.4)/conDem*100,0,100):100;
    g.sat=lerp(g.sat,target,clamp(0.3*H,0,1));
    // a wrecked reputation rebuilds faster than a good one improves
    const drift=(g.sat-82)*(g.sat>82?0.006*(1+(100-S.rep)/120):0.003)*H;
    S.rep=clamp(S.rep+(drift<0?drift*(1-U('pr')/150):drift*(1+U('pr')/400)),0,100);
    if(g.sat<35&&chance(0.03*H)){ S.rep=clamp(S.rep-2.5*(1-U('pr')/100),0,100);
      logMsg('Rolling blackouts across your grid. The public is not impressed.','bad'); }
  }
  g.freq=50+clamp(mainDem>0?(deliv-mainDem)/mainDem:0,-0.35,0.35)*2.1;
  S.st.peak=Math.max(S.st.peak,o.served);
  S.st.mwh+=o.served*H;
  // victory watch
  if(g.on[9]&&g.sat>=95){ S.winT+=H; if(S.winT>=72&&!S.win) winGame(); } else S.winT=Math.max(0,S.winT-H*0.5);
  // the site grows
  const st=plantStage();
  if(st>(S.stage||0)){ S.stage=st;
    logMsg('The site has grown into a '+STAGES[st].toLowerCase()+'.'+(siteUnits(st)>1?' Unit '+siteUnits(st)+' is on the skyline.':''),'good'); beep(740,0.12) }
}

function stepMoney(H){
  const o=S.out;
  // each feeder pays its own tariff for what it actually received
  const sales=(o.rev||0)*repMul(), spotInc=o.spill*SPOT;
  const income=sales+spotInc;
  const maint=coreThermalMax()*0.004+turbCapRaw()*0.0022+U('line')*0.0015;
  const wages=wageBill();
  // shut down, the house load is bought from the grid (free during the cold-start grace period)
  const imp=(auxState().src==='SST'&&!S.startup)?o.parasite*IMPORT_PRICE:0;
  const dsl=o.dsl||0;
  const spend=maint+wages+imp+dsl;
  o.income=income; o.spend=spend;
  o.sales=sales; o.spotInc=spotInc; o.wages=wages; o.upkeep=maint; o.imp=imp;
  S.money+=(income-spend)*H;
  S.st.earned+=income*H;
  if(S.money<-40000) gameOver('bankrupt');
}

function stepLogistics(H){
  // trucks on the road
  for(let i=S.orders.length-1;i>=0;i--){
    const or=S.orders[i];
    if(or.hold>0){ or.hold-=H; continue }
    or.eta-=H;
    if(or.eta<=0){
      const g=GOODS.find(x=>x.id===or.id);
      S.dock.push({id:or.id,qty:or.qty,left:or.qty,wait:0});
      logMsg('A truck is at the gate with '+or.qty+' '+g.unit+' of '+g.name.toLowerCase()+
        '. The yard crew has to unload it.',onDuty('yard').length?'info':'warn');
      S.orders.splice(i,1);
    }
  }
  // unloading at the dock, one truck at a time
  if(S.dock.length){
    const d=S.dock[0];
    d.left-=yardRate()*H;
    for(let i=1;i<S.dock.length;i++) S.dock[i].wait+=H;
    if(d.left<=0){
      const cap=invCap(d.id), g=GOODS.find(x=>x.id===d.id);
      const got=Math.min(d.qty,Math.max(0,cap-S.inv[d.id]));
      S.inv[d.id]+=got;
      logMsg('Unloaded '+d.qty+' '+g.unit+' of '+g.name.toLowerCase()+
        (got<d.qty?' — the store is full, '+Math.round(d.qty-got)+' went back on the truck.':'.'),
        got<d.qty?'warn':'good');
      S.dock.shift();
    }
    // waiting trucks cost you money
    if(S.dock.length>1) S.money-=(S.dock.length-1)*1.6*H;
  }
}

function stepJobs(H){
  const rate=skill();
  if(rate<=0.001) return;                      // nobody on the maintenance board
  for(let i=S.jobs.length-1;i>=0;i--){
    const j=S.jobs[i];
    j.prog+=j.rate*H*rate;
    if(j.prog>=100){ j.done(); S.jobs.splice(i,1); }
  }
}
function refreshPool(){
  S.crew.pool=[makeWorker(),makeWorker(),makeWorker()];
  S.crew.poolT=rnd(60,110);
}

function stepDamage(T,H){
  const r=S.r;
  let dmg=0;
  if(r.temp>1000) dmg+=(r.temp-1000)*0.0025;
  if(r.press>pressLimit()) dmg+=(r.press-pressLimit())*0.03;
  if(r.coolant<=0.5&&S.out.thermal>0.5)
    dmg+=0.04+clamp(S.out.thermal/Math.max(1,coreThermalMax()),0,1)*0.3;
  if(dmg>0){ r.integ=Math.max(0,r.integ-dmg*T); S.shake=Math.max(S.shake,Math.min(1,dmg*0.3)); }
  else if(r.temp<760&&r.press<pressLimit()&&S.crew.strike<=0)
    r.integ=Math.min(100,r.integ+0.03*H*skill());
  if(r.integ<72) S.rep=clamp(S.rep-(72-r.integ)*0.005*H*(1-U('pr')/100),0,100);
  if(r.integ<=0||r.temp>=2100) gameOver('meltdown');
}

/* ---------------------------- player actions --------------------------- */
function scram(reason){
  if(S.over) return;
  S.r.scramT=6; S.r.rods=100; S.st.scrams++;
  logMsg('SCRAM. All rods driven in'+(reason?' — '+reason:'')+'. Xenon will build up before you can restart.','warn');
  beep(140,0.25);
}
function topUpCoolant(){
  const want=Math.min(100-S.r.coolant,S.inv.coolant);
  if(want<=0.1){ logMsg('No makeup water in the warehouse.','warn'); return }
  S.r.coolant+=want; S.inv.coolant-=want;
  logMsg('Loop refilled with '+num(want)+' kL of makeup water.','good');
}
/* last resort when the store is empty and the loop is draining: raw river water */
function emergencyFeed(){
  if(S.r.coolant>30){ logMsg('The loop is not low enough to justify raw river water.','info'); return }
  S.r.coolant=Math.max(S.r.coolant,65);
  S.rep=clamp(S.rep-5*(1-U('scrub')/100),0,100);
  logMsg('Emergency river feed opened. Untreated water in the primary loop — the regulator will hear about this.','warn');
  beep(300,0.2);
}
function replaceAssembly(i){
  const a=S.core[i];
  if(S.r.flux>14){ logMsg('Refuelling needs the core near shutdown. Drop flux below 14% first.','warn'); return }
  if(S.inv.fuel<1){ logMsg('No fuel assemblies in store. Order some from Logistics.','warn'); return }
  S.inv.fuel--; a.burn=0; a.on=true;
  S.r.xe+=3;
  logMsg('Assembly '+(i+1)+' replaced. Fresh fuel, full reactivity.','good');
}
function addJob(name,rate,done,tag){
  if(S.jobs.some(j=>j.tag===tag)){ logMsg('That work is already on the maintenance board.','warn'); return false }
  if(!onDuty('maint').length){ logMsg('Nobody is on maintenance. Put a worker on that duty in the Supply yard.','warn'); return false }
  S.jobs.push({name,rate,prog:0,done,tag}); return true;
}
function repairPump(i){
  const p=S.pumps[i], cost=Math.round(120+U('pumpt')*4), parts=1;
  if(S.inv.parts<parts){ logMsg('Need a spare parts kit for that repair.','warn'); return }
  if(S.money<cost){ logMsg('Not enough cash for the repair.','warn'); return }
  if(!addJob('Overhaul pump '+(i+1),9,()=>{ p.h=100; logMsg('Pump '+(i+1)+' overhauled — back to full flow.','good') },'p'+i)) return;
  S.inv.parts-=parts; S.money-=cost;
}
function repairTurb(i){
  const t=S.turbs[i], cost=Math.round(turbCost(t.m)*0.09), parts=2;
  if(S.inv.parts<parts){ logMsg('Need two parts kits for a turbine overhaul.','warn'); return }
  if(S.money<cost){ logMsg('Not enough cash for the overhaul.','warn'); return }
  if(!addJob('Overhaul '+TURBS[t.m].name,6,()=>{ t.h=100; logMsg(TURBS[t.m].name+' overhauled.','good') },'t'+i)) return;
  S.inv.parts-=parts; S.money-=cost;
}
function sealLeak(){
  if(S.r.leak<=0){ logMsg('No leak to seal.','info'); return }
  if(S.inv.parts<1){ logMsg('Need a parts kit to seal the loop.','warn'); return }
  if(!addJob('Seal coolant leak',14,()=>{ S.r.leak=0; logMsg('Coolant leak sealed.','good') },'leak')) return;
  S.inv.parts--;
}
function repairLine(){
  const cost=Math.round(200+U('line')*6);
  if(S.money<cost){ logMsg('Not enough cash to re-string the line.','warn'); return }
  if(S.inv.parts<1){ logMsg('Need a parts kit for switchyard repairs.','warn'); return }
  if(!addJob('Repair switchyard',11,()=>{ S.grid.lineH=100; S.grid.trip=0; logMsg('Switchyard repaired.','good') },'line')) return;
  S.money-=cost; S.inv.parts--;
}
function overhaulCore(){
  const cost=Math.round(900+coreThermalMax()*2.5);
  if(S.r.flux>14){ logMsg('Containment work needs the core near shutdown.','warn'); return }
  if(S.inv.parts<3){ logMsg('Containment work needs three parts kits.','warn'); return }
  if(S.money<cost){ logMsg('Not enough cash for containment work.','warn'); return }
  if(!addJob('Containment repairs',5,()=>{ S.r.integ=Math.min(100,S.r.integ+35); logMsg('Containment repaired. Integrity recovered.','good') },'integ')) return;
  S.money-=cost; S.inv.parts-=3;
}
function order(id,mult){
  const g=GOODS.find(x=>x.id===id);
  const qty=g.pack*mult;
  const cost=Math.round(goodPrice(g)*qty);
  if(S.money<cost){ logMsg('Not enough cash for that order.','warn'); return }
  S.money-=cost;
  S.orders.push({id,qty,eta:g.eta*rnd(0.8,1.2),hold:0,cost});
  logMsg('Ordered '+qty+' '+g.unit+' of '+g.name.toLowerCase()+' for '+money(cost)+'.','info');
}
function buyUpgrade(id){
  if(upMax(id)) return;
  const c=upCost(id);
  if(S.money<c){ logMsg('Not enough cash.','warn'); return }
  S.money-=c; S.up[id]++;
  if(id==='core'){ while(S.core.length<U('core')) S.core.push({burn:100,on:true});
    logMsg('Core expanded to '+U('core')+' positions. The new ones are empty — load fuel.','good'); }
  else if(id==='loops'){ logMsg('Coolant loop '+U('loops')+' commissioned.','good'); }
  else logMsg(UPGBY[id].name+' upgraded to '+UPGBY[id].vals[S.up[id]]+UPGBY[id].unit+'.','good');
  beep(660,0.08);
}
function buyTurbine(m){
  if(S.turbs.length>=8){ logMsg('The turbine hall is full. Eight sets is the limit.','warn'); return }
  if(S.money<turbCost(m)){ logMsg('Not enough cash.','warn'); return }
  S.money-=turbCost(m); S.turbs.push({m,h:100,on:true,spin:0});
  logMsg(TURBS[m].name+' installed — '+mw(TURBS[m].cap)+' of extra capacity.','good');
}
function sellTurbine(i){
  if(S.turbs.length<=1){ logMsg('You need at least one turbine.','warn'); return }
  const t=S.turbs[i]; S.money+=turbCost(t.m)*0.3*(t.h/100);
  logMsg(TURBS[t.m].name+' sold for scrap.','info'); S.turbs.splice(i,1);
}
function connectTier(i){
  const T=TIERS[i];
  if(S.grid.on[i]) return;
  if(S.rep<T.rep){ logMsg('Need '+T.rep+' reputation before '+T.name+' will sign a contract.','warn'); return }
  if(S.money<tierCost(i)){ logMsg('Not enough cash to build out to '+T.name+'.','warn'); return }
  S.money-=tierCost(i); S.grid.on[i]=true; S.grid.fd[i]='main';
  logMsg('Connected '+T.name+' — '+T.w+' now depend on you for '+mw(T.demand)+'.','good');
  beep(880,0.1);
}
function hireWorker(i){
  const w=S.crew.pool[i]; if(!w) return;
  if(crewCount()>=10){ logMsg('Ten on the books is all the site can house.','warn'); return }
  const fee=hireFee(w);
  if(S.money<fee){ logMsg('Not enough cash for '+wName(w)+"'s signing fee.",'warn'); return }
  S.money-=fee;
  w.duty='rest';
  S.crew.workers.push(w);
  S.crew.pool.splice(i,1);
  logMsg('Hired '+wName(w)+' — '+TRAITBY[w.trait].name.toLowerCase()+', '+money(w.wage)+'/h. Give them a duty.','good');
  beep(760,0.09);
}
function dismissWorker(id){
  const w=S.crew.workers.find(x=>x.id===id); if(!w) return;
  S.crew.workers=S.crew.workers.filter(x=>x.id!==id);
  for(const o of S.crew.workers) o.mood=clamp(o.mood-6,0,100);
  logMsg('Let '+wName(w)+' go. The rest of the crew took note.','info');
}
function setDuty(id,duty){
  const w=S.crew.workers.find(x=>x.id===id); if(!w) return;
  w.duty=duty;
}

 {id:'blackout',name:'Loss of Offsite Power',w:()=>tiersOn()>2?0.7:0.1,run(){
   S.ev.active.push({id:'blackout',name:'Loss of offsite power',until:rnd(8,16),genMul:0.85});
   const gen=S.out.gross>0.0005;
   return 'Loss of offsite power — the station transformer is dead. '+
     (gen?'The unit is carrying its own house load through the UAT. If it trips, '+(U('diesel')>0?'the diesels must pick up the safety bus.':'there are no diesels to fall back on.')
        :U('diesel')>0?'The emergency diesels have started on the safety bus.':'No diesels fitted — the pumps are coasting down. Cool the core NOW.');
 },kind:'bad'},
 {id:'grant',name:'Government Grant',w:()=>S.rep>62?1.0:0,run(){
   const g=Math.round(2000+S.st.earned*0.03+U('line')*300);
   S.money+=g;
   return 'Energy ministry grant awarded on the strength of your record: '+money(g)+'.';
 },kind:'good'},
 {id:'contract',name:'Spot Contract',w:()=>S.grid.sat>93?1.0:0,run(){
   const g=Math.round(600+S.out.served*rateNow()*4);
   S.money+=g;
   return 'A neighbouring utility bought '+money(g)+' of spot power from you. Nice work.';
 },kind:'good'},
 {id:'flood',name:'River Flood',w:()=>tiersOn()>1?0.7:0.2,run(){
   const d=1-U('seis')/160;
   const n=U('loops'); for(let i=0;i<n;i++) if(chance(0.3)) S.pumps[i].h=Math.max(0,S.pumps[i].h-rnd(10,40)*d);
   S.r.inlet=42; S.ev.active.push({id:'flood',name:'Flooded intake',until:rnd(14,28),coolMul:0.82,onEnd(){S.r.inlet=34}});
   return 'The river is over the intake screens. Flooding in the pump house.';
 },kind:'bad'}
];
const EVBY={}; EVENTS.forEach(e=>EVBY[e.id]=e);

function stepEvents(T,H){
  for(let i=S.ev.active.length-1;i>=0;i--){
    const e=S.ev.active[i]; e.until-=H;
    if(e.until<=0){ if(e.onEnd) e.onEnd(); S.ev.active.splice(i,1);
      logMsg(e.name+' has cleared.','good'); }
  }
  if(S.startup){ S.ev.next=rnd(30,50); return }   // nothing goes wrong before you first sync
  S.ev.next-=H;
  if(S.ev.next<=0){
    // a bigger grid draws more trouble; a well-staffed control room heads some of it off
    S.ev.next=rnd(70,170)*(1+dutyPower('ctrl')*0.05)/(1+tiersOn()*0.06);
    fireEvent();
  }
}
function fireEvent(forceId){
  let e;
  if(forceId) e=EVBY[forceId];
  else{
    const pool=EVENTS.filter(x=>x.w()>0&&!evActive(x.id));
    if(!pool.length) return;
    let tot=0; pool.forEach(x=>tot+=x.w());
    let r=Math.random()*tot;
    for(const x of pool){ r-=x.w(); if(r<=0){ e=x; break } }
    e=e||pool[0];
  }
  if(!e) return;
  const msg=e.run();
  S.st.events++;
  logMsg(msg,e.kind);
  if(e.kind==='bad'){ S.flash=Math.max(S.flash,0.5); beep(170,0.2) } else if(e.kind==='good') beep(700,0.12);
}

/* ---------------------------- endings ---------------------------------- */
function gameOver(kind){
  if(S.over) return;
  S.over=kind; S.flash=1.4; S.shake=1.4; S.speed=1; beep(70,1.1);
  if(kind==='meltdown'){
    logMsg('CORE MELTDOWN. Containment has failed. The plant is lost.','bad');
    S.view='grid';
  } else logMsg('Bankrupt. The receivers have taken the keys.','bad');
  setTimeout(showEnd,kind==='meltdown'?2600:600);
}
function winGame(){
  S.win=true; S.ending='world';
  logMsg('THE WORLD IS ON YOUR GRID. Three days of stable supply at full load. Neuclify complete.','good');
  showWin();
}
/* ============================ 4. PIXEL RENDER ============================ */
/* The canvas is a fixed 480 px wide and its height follows the stage, so each scene fills
   the space instead of sitting in a letterbox. Scenes are laid out from the floor up and
   any extra height becomes ceiling, roof or sky. They carry no figures that the HUD or
   the side panel already show: they are pictures of the plant, not a second dashboard. */
let AT=0;                                    // animation clock — stops while paused
const STARS=[]; for(let i=0;i<110;i++) STARS.push({x:Math.random(),y:Math.random(),b:rnd(0.3,1)});
let ctrlHit=null;
const coreHit=[], turbHit=[], gridHit=[];

function fitCanvas(){
  const el=$('canwrap'); if(!el||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect();
  if(!(r.width>40&&r.height>40)) return;
  const h=clamp(Math.round(VW*r.height/r.width),240,420);
  if(h!==VH||cv.height!==h||cv.width!==VW){ VH=h; cv.width=VW; cv.height=VH; }
}

function sensor(v,amp){ // instrument reading, corrupted while SCADA is compromised
  if(S.r.noise<=0) return v;
  return v*(1+Math.sin(S.t*7.3+v)*0.11)+Math.sin(S.t*13.1)*(amp||0.6);
}
function nightF(){ // 0 day .. 1 night
  const h=S.hours;
  if(h<5) return 1; if(h<7.5) return 1-(h-5)/2.5;
  if(h<17.5) return 0; if(h<20.5) return (h-17.5)/3; return 1;
}

/* ---- drawing primitives ------------------------------------------------ */
function line(x0,y0,x1,y1,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let e=dx+dy; ctx.fillStyle=c;
  for(let n=0;n<3000;n++){
    ctx.fillRect(x0,y0,1,1);
    if(x0===x1&&y0===y1) break;
    const e2=2*e; if(e2>=dy){e+=dy;x0+=sx} if(e2<=dx){e+=dx;y0+=sy}
  }
}
function disc(cx,cy,r,c){
  ctx.fillStyle=c;
  for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y+r*0.6)); ctx.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1) }
}
function ring(cx,cy,r,c){
  for(let a=0;a<Math.max(16,r*8);a++){ const t=a/Math.max(16,r*8)*Math.PI*2;
    px(Math.round(cx+Math.cos(t)*r),Math.round(cy+Math.sin(t)*r),1,1,c) }
}
function headInset(yy,h,ry,r){
  let t=0;
  if(yy<ry) t=(ry-yy-0.5)/ry; else if(yy>=h-ry) t=(yy-(h-ry)+0.5)/ry;
  return t>0?Math.round(r*(1-Math.sqrt(Math.max(0,1-t*t)))):0;
}
/* a vertical pressure vessel with elliptical heads, shaded like a cylinder */
function vessel(x,y,w,h,ry,base,light,dark,edge){
  const r=w/2; let prev=null;
  for(let yy=0;yy<h;yy++){
    const ins=headInset(yy,h,ry,r), X=Math.round(x+ins), Wd=Math.round(w-ins*2), Y=Math.round(y+yy);
    if(Wd>0){
      px(X,Y,Wd,1,base);
      if(Wd>3){ px(X+Math.round(Wd*0.16),Y,Math.max(1,Math.round(Wd*0.15)),1,light);
                const dw=Math.max(1,Math.round(Wd*0.26)); px(X+Wd-dw,Y,dw,1,dark); }
      if(edge){
        px(X,Y,1,1,edge); px(X+Wd-1,Y,1,1,edge);
        if(yy===0||yy===h-1) px(X,Y,Wd,1,edge);
        else if(prev!==null&&Math.abs(prev-ins)>1){ const a=Math.min(prev,ins),b=Math.max(prev,ins);
          px(Math.round(x+a),Y,b-a,1,edge); px(Math.round(x+w-b),Y,b-a,1,edge); }
      }
    }
    prev=ins;
  }
}
/* fill rows y0..y1 of a vessel's interior profile; half=-1/1 fills one side only */
function vband(x,y,w,h,ry,y0,y1,c,half){
  const r=w/2;
  for(let Y=Math.max(Math.round(y0),y);Y<Math.min(Math.round(y1),y+h);Y++){
    const ins=headInset(Y-y,h,ry,r), Wd=Math.round(w-ins*2);
    if(Wd<=0) continue;
    const X=Math.round(x+ins);
    if(!half) px(X,Y,Wd,1,c);
    else if(half<0) px(X,Y,Math.ceil(Wd/2),1,c);
    else px(X+Math.floor(Wd/2),Y,Math.ceil(Wd/2),1,c);
  }
}
/* the same lying on its side: generators, turbine casings, condensers, tankers */
function hvessel(x,y,w,h,rx,base,light,dark,edge){
  const r=h/2; let prev=null;
  for(let xx=0;xx<w;xx++){
    const ins=headInset(xx,w,rx,r), Y=Math.round(y+ins), Hh=Math.round(h-ins*2), X=Math.round(x+xx);
    if(Hh>0){
      px(X,Y,1,Hh,base);
      if(Hh>3){ px(X,Y+Math.round(Hh*0.14),1,Math.max(1,Math.round(Hh*0.16)),light);
                const dh=Math.max(1,Math.round(Hh*0.26)); px(X,Y+Hh-dh,1,dh,dark); }
      if(edge){
        px(X,Y,1,1,edge); px(X,Y+Hh-1,1,1,edge);
        if(xx===0||xx===w-1) px(X,Y,1,Hh,edge);
        else if(prev!==null&&Math.abs(prev-ins)>1){ const a=Math.min(prev,ins),b=Math.max(prev,ins);
          px(X,Math.round(y+a),1,b-a,edge); px(X,Math.round(y+h-b),1,b-a,edge); }
      }
    }
    prev=ins;
  }
}
/* pipework along an axis-aligned polyline, and particles travelling along it */
function polyLen(p){ let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); return L }
function polyAt(p,t){
  let d=(((t%1)+1)%1)*polyLen(p);
  for(let i=1;i<p.length;i++){
    const s=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
    if(d<=s){ const f=s?d/s:0; return [p[i-1][0]+(p[i][0]-p[i-1][0])*f, p[i-1][1]+(p[i][1]-p[i-1][1])*f] }
    d-=s;
  }
  return p[p.length-1];
}
function pipe(p,w,c,edge){
  const h=Math.floor(w/2);
  if(edge) for(let i=1;i<p.length;i++){
    const [x0,y0]=p[i-1],[x1,y1]=p[i], X=Math.min(x0,x1), Y=Math.min(y0,y1);
    if(y0===y1) px(X-h-1,Y-h-1,Math.abs(x1-x0)+w+2,w+2,edge);
    else if(x0===x1) px(X-h-1,Y-h-1,w+2,Math.abs(y1-y0)+w+2,edge);
  }
  for(let i=1;i<p.length;i++){
    const [x0,y0]=p[i-1],[x1,y1]=p[i], X=Math.min(x0,x1), Y=Math.min(y0,y1);
    if(y0===y1) px(X-h,Y-h,Math.abs(x1-x0)+w,w,c);
    else if(x0===x1) px(X-h,Y-h,w,Math.abs(y1-y0)+w,c);
    else line(x0,y0,x1,y1,c);
  }
}
function flow(p,n,speed,c,size){
  if(speed<=0.001) return;
  const s=size||1;
  for(let i=0;i<n;i++){ const q=polyAt(p,AT*speed+i/n); px(Math.round(q[0]-s/2),Math.round(q[1]-s/2),s,s,c) }
}
/* a lattice transmission tower; returns the three conductor attachment points */
function pylon(x,gy,h,c,dark){
  const bw=Math.max(4,Math.round(h*0.3)), tw=2;
  for(let i=0;i<=h;i++){
    const w=Math.round(bw-(bw-tw)*(i/h)), hw=w>>1;
    px(x-hw,gy-i,1,1,c); px(x+hw,gy-i,1,1,c);
    if(i%5===0&&i<h-2&&hw>1) line(x-hw,gy-i,x+hw,gy-i-4,dark);
  }
  const a1=gy-h+Math.round(h*0.15), a2=gy-h+Math.round(h*0.36), arm=Math.round(h*0.34);
  px(x-arm,a1,arm*2+1,1,c); px(x-Math.round(arm*0.75),a2,Math.round(arm*1.5)+1,1,c);
  px(x,gy-h-2,1,3,c);
  px(x-arm,a1+1,1,2,'#c9d2d9'); px(x+arm,a1+1,1,2,'#c9d2d9'); px(x+Math.round(arm*0.75),a2+1,1,2,'#c9d2d9');
  return [[x-arm,a1+3],[x+arm,a1+3],[x+Math.round(arm*0.75),a2+3]];
}
function catenary(x0,y0,x1,y1,sag,c){
  const n=Math.max(3,Math.abs(x1-x0)>>2); let a=x0,b=y0;
  for(let i=1;i<=n;i++){ const t=i/n, X=x0+(x1-x0)*t, Y=y0+(y1-y0)*t+sag*4*t*(1-t); line(a,b,X,Y,c); a=X; b=Y }
}
function trefoil(x,y){
  px(x,y,7,7,'#f2c23a'); rect(x,y,7,7,'#6b5414');
  px(x+3,y+3,1,1,'#1d1d1d'); px(x+1,y+1,2,2,'#1d1d1d'); px(x+4,y+1,2,2,'#1d1d1d'); px(x+2,y+4,3,2,'#1d1d1d');
}
/* the sky above an outdoor scene, with sun or moon, stars and drifting cloud */
function skyFill(y0,y1){
  const nf=nightF(), hgt=y1-y0;
  const day=['#4b82ab','#5f93ba','#78a8c9','#94bcd6','#aecddf'];
  const dusk=['#232548','#3b3460','#634566','#94586a','#c4776a'];
  const night=['#060c1a','#091226','#0d1830','#121f3a','#172745'];
  const pal=nf>0.7?night:nf>0.18?dusk:day;
  for(let i=0;i<pal.length;i++) px(0,y0+Math.round(hgt*i/pal.length),VW,Math.ceil(hgt/pal.length)+1,pal[i]);
  if(nf>0.4) for(const s of STARS){ ctx.globalAlpha=Math.min(1,(nf-0.4)*1.7)*s.b;
    px(Math.round(s.x*VW),Math.round(y0+s.y*hgt*0.85),1,1,'#dff0f6'); }
  ctx.globalAlpha=1;
  if(nf<0.72){
    const t=clamp((S.hours-6)/12,0,1), sx=40+t*(VW-80), sy=y1-12-Math.sin(t*Math.PI)*(hgt-28);
    ctx.globalAlpha=0.18*(1-nf); disc(sx,sy,10,'#ffe9a0'); ctx.globalAlpha=1-nf*0.6; disc(sx,sy,5,'#fff2c0'); ctx.globalAlpha=1;
  } else { const mx=VW-80, my=y0+Math.min(24,hgt*0.3); disc(mx,my,5,'#dfe7ee'); disc(mx+3,my-2,4,pal[0]) }
  if(nf<0.75) for(let i=0;i<5;i++){
    const x=((i*137+AT*(1.5+i*0.4))%(VW+90))-45, y=y0+8+((i*41)%Math.max(10,Math.round(hgt*0.45)));
    ctx.globalAlpha=0.5*(1-nf);
    px(x,y,26,4,'#eef3f6'); px(x+5,y-3,14,3,'#eef3f6'); px(x+16,y-1,10,3,'#eef3f6');
  }
  ctx.globalAlpha=1;
}

/* ---- people ------------------------------------------------------------- */
const SKIN=['#d7a884','#a9754f','#73513a','#efc39c','#8d5f42','#c69272'];
const HAIR=['#2b2119','#4a3526','#6b4a2a','#8a8070','#1d2228','#5b3a2e','#b07a3a'];
const SHIRTS=['#2e6b8f','#c2742b','#4a7a52','#8a4a6b','#4b5a8a','#8a7a3a'];
const wSkin=w=>SKIN[w.id%SKIN.length];
const wHair=w=>HAIR[(w.id*3)%HAIR.length];
const wShirt=w=>SHIRTS[(w.id*5)%SHIRTS.length];
/* an operator seen from behind, sat at a console */
function seatedWorker(x,y,w,busy){
  const bob=Math.round(Math.sin(AT*1.6+w.ph)*0.6);
  const lean=busy&&Math.sin(AT*2.2+w.ph)>0.72?1:0, o=bob+lean;
  px(x-2,y+10,12,12,'#1b232a'); rect(x-2,y+10,12,12,'#2b3742'); px(x+3,y+22,2,3,'#2b3742');  // chair
  px(x-1,y+7+o,10,8,wShirt(w)); px(x-1,y+7+o,10,1,'#00000033');                               // shoulders
  px(x+1,y+1+o,6,7,wSkin(w)); px(x+1,y+o,6,4,wHair(w)); px(x,y+2+o,1,3,wHair(w)); px(x+7,y+2+o,1,3,wHair(w));
  if(lean) px(x-2,y+9+o,2,3,wSkin(w));
  if(w.fat>70&&Math.floor(AT*0.8)%4===0) text('Z',x+9,y-4+bob,'#7d9389',1);
}
/* a worker walking side-on; hard hat and hi-vis on the yard and maintenance crews */
function walker(x,y,w,dir,carry,hivis){
  const step=Math.floor(AT*5+w.ph*3)%2;
  px(x+1,y+1,5,5,wSkin(w));
  if(hivis){ px(x,y-1,7,3,'#f2c23a'); px(x+(dir>0?5:-1),y+1,2,1,'#f2c23a') } else px(x+1,y,5,3,wHair(w));
  px(x,y+6,7,7,hivis?'#d8d43a':wShirt(w)); if(hivis) px(x,y+9,7,1,'#c9d2d9');
  px(x+(step?0:2),y+13,2,3,'#20262c'); px(x+(step?4:3),y+13,2,3,'#20262c');
  if(carry){ px(dir>0?x+6:x-4,y+5,5,5,carry); rect(dir>0?x+6:x-4,y+5,5,5,'#00000055') }
  else px(dir>0?x+7:x-1,y+7,1,4,wSkin(w));
}
/* a lorry; cab on the left unless flipped. y is the road surface under the wheels */
function lorry(x,y,type,moving,loadF,flip){
  if(flip){ ctx.save(); ctx.translate(x*2+52,0); ctx.scale(-1,1) }
  const cab=type==='fuel'?'#3d6b4f':type==='coolant'?'#2e5f86':type==='food'?'#a7472f':'#6b5aa0';
  if(type==='coolant'){
    hvessel(x+15,y-15,36,11,5,'#c9d2d9','#eef3f6','#8f9aa3','#4a545c');
    px(x+15,y-5,36,2,'#2b3238'); px(x+30,y-17,6,2,'#8f9aa3');
  } else if(type==='parts'){
    px(x+15,y-7,36,2,'#5a4632');
    const n=Math.round(clamp(loadF,0,1)*6);
    for(let k=0;k<n;k++){ const bx=x+17+(k%3)*11, by=y-13-Math.floor(k/3)*6;
      px(bx,by,10,6,'#8a6a3e'); rect(bx,by,10,6,'#4a3a22'); px(bx+4,by,1,6,'#c9b23a') }
  } else {
    px(x+15,y-19,36,14,type==='fuel'?'#e6e2d2':'#d9dde0'); rect(x+15,y-19,36,14,'#5a6168');
    for(let k=1;k<6;k++) px(x+15+k*6,y-18,1,12,'#c2c6c8');
    if(type==='fuel') trefoil(x+29,y-16); else { px(x+17,y-16,32,2,'#3f7fa6'); px(x+15,y-22,7,3,'#9aa6ae') }
  }
  px(x+1,y-15,14,10,cab); px(x+1,y-15,14,1,'#ffffff33');
  px(x+3,y-13,6,4,'#9cc8e8'); px(x+1,y-5,14,2,'#2b3238'); px(x+13,y-18,2,6,'#8a949c');
  const sp=moving?Math.floor(AT*10)%2:0;
  for(const wx of [x+3,x+21,x+39,x+45]){ px(wx,y-3,5,3,'#0e1316'); px(wx+2,y-2,1,1,sp?'#5a646c':'#2a3238') }
  if(flip) ctx.restore();
}

function render(dt){
  if(!S.paused&&!ovOpen&&!S.over) AT+=dt*Math.min(S.speed,2); else if(S.over) AT+=dt;
  ctx.save();
  if(SET.shake&&S.shake>0.02){ const s=S.shake*3; ctx.translate(Math.round(rnd(-s,s)),Math.round(rnd(-s,s))) }
  px(-8,-8,VW+16,VH+16,P.black);
  const v=S.view;
  if(v==='ctrl') drawCtrl(); else if(v==='core') drawCore();
  else if(v==='turb') drawTurb(); else if(v==='grid') drawGrid();
  else if(v==='logi') drawLogi(); else drawRnd();
  ctx.restore();
}


/* ======================= VIEW: MAIN CONTROL ROOM ======================= */
/* A real control room has no window onto the reactor: the plant is read from the board.
   Annunciator windows along the top, rod position indicators and recorders on the
   reactor section, a lit mimic of the whole plant in the middle, generator meters and a
   synchroscope on the electrical section, and the operators' consoles in front. */
function histPeak(){ let m=0.01; for(const v of S.hist.out) if(v>m) m=v; for(const v of S.hist.dem) if(v>m) m=v; return m }
function stripChart(x,y,w,h,series){
  px(x-2,y-2,w+4,h+4,'#2a332e'); rect(x-2,y-2,w+4,h+4,'#1b221e');
  px(x,y,w,h,'#d8d1b2');
  const off=Math.floor(AT*4)%6;
  for(let gx=x+6-off;gx<x+w;gx+=6) px(gx,y,1,h,'#c7bf9a');
  for(let gy=y+h-1;gy>y;gy-=Math.max(5,Math.floor(h/4))) px(x,gy,w,1,'#c7bf9a');
  for(const s of series){
    const a=s.data; if(!a||a.length<2) continue;

/* status of the six critical safety functions: 0 satisfied, 1 off-normal, 2 challenged, 3 in jeopardy */
function csfStatus(){
  const r=S.r, th=S.out.thermal, st=settleTemp(), lim=pressLimit();
  const hs=S.ev.active.some(e=>e.id==='cond'||e.id==='heat'||e.id==='flood');
  const noSink=th>coreThermalMax()*0.05&&turbCap()<=0;
  return [
    r.jam>0&&st>1000?3:(r.flux>130||r.jam>0)?2:(r.xe>60||r.flux>110)?1:0,
    coolCap()<th&&th>0.01?3:st>1000?2:st>820?1:0,
    noSink&&hs?3:(noSink||hs)?2:S.out.bypass>0.001?1:0,
    r.press>lim?3:r.press>lim*0.95?2:r.press>lim*0.88?1:0,
    r.integ<30?3:r.integ<50?2:r.integ<80?1:0,
    r.coolant<15?3:r.coolant<30?2:(r.coolant<55||r.leak>0)?1:0

}

/* ======================= VIEW: REACTOR BUILDING ======================= */
/* A cutaway of a pressurised-water reactor containment. The pressure vessel sits in its
   concrete cavity with the control rod drives on the head. Each coolant loop runs a hot
   leg to a U-tube steam generator, back through a crossover leg to its reactor coolant
   pump, and into the vessel's downcomer. One pressurizer rides on the first hot leg. */
const STEEL=['#6f7c86','#9aa8b2','#4b5660','#262d33'];
function rpvColumns(){ return Math.max(1,Math.min(S.core.length,8)) }
function coreLoop(side,G,hotC,coldC,pump,isFirst){
  const M=x=>side>0?x:480-x, R=(x,w)=>side>0?x:480-x-w;
  const pf=pump.s/100*pump.h/100, sp=0.12+0.5*pf;
  const steamF=clamp(S.out.gross/Math.max(0.001,turbCapRaw()),0,1);
  // pipework first so the vessels sit over the joints
  pipe([[M(268),G-100],[M(366),G-100]],6,hotC,'#1b2126');
  pipe([[M(386),G-92],[M(386),G-30],[M(320),G-30],[M(320),G-44]],6,coldC,'#1b2126');
  pipe([[M(312),G-50],[M(290),G-50],[M(290),G-90],[M(268),G-90]],6,coldC,'#1b2126');
  pipe([[M(394),G-178],[M(432),G-178],[M(432),G-140],[M(466),G-140]],4,'#c9d4da','#1b2126');

/* ======================= VIEW: TURBINE HALL ======================= */
/* Each set is a real turbine-generator train on its table-top deck: steam stop and
   control valves, a high-pressure turbine, a moisture separator reheater feeding the
   low-pressure casings through crossover pipes, then the generator and its exciter, all
   on one shaft. The condenser sits in the bay beneath the low-pressure turbines. Bigger
   models carry more low-pressure casings. */
function drawTG(x,y,w,h,t,i){
  const nLP=[1,1,2,2,3,3][t.m];
  const running=t.on&&t.h>0&&S.out.gross>0.0005;
  // size the train from the bay, then stand deck and condenser on the bay floor
  const L=w*0.9, x0=x+w*0.05, u=Math.max(5,Math.min(h*0.17,L/9.5));
  const below=Math.round(u*1.8), deckY=y+h-below-16;

  px(x+2,deckY,w-4,4,'#6a747c'); px(x+2,deckY,w-4,1,'#8a949c');
  const legs=Math.max(3,Math.round(w/56));
  for(let k=0;k<legs;k++){ const lx=x+6+Math.round(k*(w-17)/(legs-1)); px(lx,deckY+4,5,y+h-deckY-6,'#59636c'); px(lx,deckY+4,1,y+h-deckY-6,'#6a747c') }
  px(x,y+h-2,w,2,'#323c44');
  // train proportions
  const parts=[['v',0.06],['hp',0.15]]; for(let k=0;k<nLP;k++) parts.push(['lp',0.15]); parts.push(['gen',0.22],['ex',0.05]);
  const gap=0.02, tot=parts.reduce((s,p)=>s+p[1],0)+gap*(parts.length-1);
  const yC=deckY-Math.round(u*1.0);
  let cx=x0; const at={};
  parts.forEach(p=>{ const len=p[1]/tot*L; (at[p[0]]=at[p[0]]||[]).push([Math.round(cx),Math.round(len)]); cx+=len+gap/tot*L });
  const hp=at.hp[0], gen=at.gen[0], ex=at.ex[0], lps=at.lp, v=at.v[0];

  px(0,y0,W,D,'#071017'); px(0,y0,W,1,'#2b3742');
  for(let x=0;x<W;x+=8) px(x,y0+1,1,D-1,'#0a1820');
  for(let y=y0+8;y<y0+D;y+=8) px(0,y,W,1,'#0a1820');
  const yA=y0+13, yGB=y0+36, yU=y0+Math.max(62,Math.round(D*0.6));
  const gen=ax.gen, busA=gen||ax.offsite, lineOK=g.trip<=0&&g.lineH>0;
  // generators on the 24 kV generator bus
  S.turbs.forEach((t,k)=>{
    const x=16+k*14, run=t.on&&t.h>0&&gen;
    olMachine(x,y0+19,'G',run,run);
    olWire([[x,y0+24],[x,y0+27]],run); olBreaker(x,y0+29,t.on&&t.h>0,run); olWire([[x,y0+31],[x,yGB]],run);
  });
  const stg=plantStage(), yardKV=['11','33','132','275','400','400'][stg];
  olBus(10,124,yGB,gen,null); text((stg<2?'11':'24')+' KV GEN',10,yGB+4,gen?'#c9d8b0':'#5d7181',1);
  // main step-up transformer and generator breaker into the switchyard
  olWire([[124,yGB],[125,yGB]],gen); olXfmr(131,yGB,gen,false); text('GSU',126,yGB+5,'#6f8a96',1);
  olWire([[137,yGB],[146,yGB],[146,yA+8]],gen,-1); olBreaker(146,yA+5,gen,gen); olWire([[146,yA+3],[146,yA]],gen,-1);
  // 400 kV switchyard and the line bays out to each customer
  olBus(140,W-8,yA,busA,yardKV+' KV SWITCHYARD');
  // each feeder bay: a breaker onto the switchyard and, with diesels fitted, a second breaker
  // onto the backup bus below. Only one is ever closed.
  const yB=yA+36, fsv=S.out.fs||[], bkLive=ax.edgs>0&&ax.run;
  if(ax.edgs>0){ olBus(226,W-12,yB,bkLive,null); text('BACKUP',198,yB-2,bkLive?'#ffb23a':'#5d7181',1) }
  for(let i=0;i<10;i++){
    const x=238+i*24, on=g.on[i], m=feedMode(i), fed=on&&(fsv[i]||0)>0;
    const closed=on&&lineOK&&m==='main', live=closed&&busA;
    olWire([[x,yA],[x,yA+4]],busA&&on); olBreaker(x,yA+7,closed,live);
    olWire([[x,yA+10],[x,yA+16]],live); olWire([[x,yA+16],[x,yA+21]],fed);
    if(on&&ax.edgs>0){ const bc=m==='edg';
      olWire([[x+9,yB],[x+9,yB-3]],bkLive); olBreaker(x+9,yB-6,bc,bc&&fed);
      olWire([[x+9,yB-9],[x+9,yA+16],[x,yA+16]],bc&&fed,-1) }
    if(on){ px(x-1,yA+21,3,1,fed?'#e8cf5a':'#2f3d47'); px(x,yA+22,1,1,fed?'#e8cf5a':'#2f3d47') }
    textC(FEED[i],x,yA+25,!on?'#3a4a56':m==='off'?'#6f8a96':fed?(m==='edg'?'#ffb23a':'#c9d8b0'):'#ff8b85',1);
  }
  // station service transformer down to the station bus
  olWire([[176,yA],[176,yA+7]],busA&&ax.offsite); olXfmr(176,yA+12,ax.offsite,true); text('SST',182,yA+10,'#6f8a96',1);
  olWire([[176,yA+16],[176,yU]],ax.offsite);
  // unit auxiliary transformer off the generator bus down to the unit bus
  const uatOn=ax.src==='UAT', unitLive=ax.src==='UAT'||ax.src==='SST';
  olWire([[100,yGB],[100,yGB+5]],gen); olXfmr(100,yGB+11,gen,true); text('UAT',106,yGB+8,'#6f8a96',1);
  olWire([[100,yGB+15],[100,yU-6]],gen); olBreaker(100,yU-4,uatOn,gen); olWire([[100,yU-2],[100,yU]],uatOn);
  // 6.6 kV buses: unit bus, bus tie, station bus, safety bus
  olBus(30,150,yU,unitLive,'6.6 KV UNIT');
  olBreaker(158,yU,ax.src==='SST',ax.src==='SST'); olWire([[150,yU],[156,yU]],ax.src==='SST'); olWire([[160,yU],[168,yU]],ax.src==='SST');
  olBus(168,214,yU,ax.offsite,null); text('STATION',180,yU-8,ax.offsite?'#c9d8b0':'#5d7181',1);
  const safeLive=ax.offsite||ax.run;
  olWire([[214,yU],[220,yU]],ax.offsite); olBreaker(222,yU,ax.offsite,ax.offsite); olWire([[224,yU],[232,yU]],ax.offsite);
  olBus(232,338,yU,safeLive,'SAFETY BUS');
  // loads on the unit bus: one reactor coolant pump per loop, then the feed pump
  for(let i=0;i<U('loops');i++){
    const x=40+i*16, p=S.pumps[i], run=unitLive&&p.s>2&&p.h>0;
    olWire([[x,yU],[x,yU+4]],unitLive); olBreaker(x,yU+6,unitLive&&p.h>0,unitLive); olWire([[x,yU+8],[x,yU+11]],run);
    olMachine(x,yU+16,'M',unitLive&&p.h>0,run);
  }
  text('REACTOR COOLANT PUMPS',30,yU+24,'#6f8a96',1);
  { const x=140, run=unitLive&&gen; olWire([[x,yU],[x,yU+11]],unitLive); olMachine(x,yU+16,'M',unitLive,run); text('FW',x+7,yU+14,'#6f8a96',1) }
  // decay-heat removal loads and the emergency diesels on the safety bus
  [['RHR',246],['AFW',266]].forEach(([nm,x])=>{
    olWire([[x,yU],[x,yU+11]],safeLive); olMachine(x,yU+16,'M',safeLive,safeLive&&(S.r.flux<5||ax.src!=='UAT'));
    textC(nm,x,yU+24,'#6f8a96',1);
  });
  if(ax.edgs===0) text('NO DIESELS',290,yU+12,'#5d7181',1);
  // the backup tie off the end of the safety bus, up to the backup bus
  if(ax.edgs>0){ const tie=(S.out.bk||0)>0;
    olWire([[338,yU],[344,yU],[344,yU-4]],tie); olBreaker(344,yU-7,tie,tie); olWire([[344,yU-10],[344,yA+36]],tie,-1) }
  for(let k=0;k<ax.edgs;k++){
    const x=296+k*16, run=ax.run;
    olWire([[x,yU],[x,yU+4]],safeLive&&run); olBreaker(x,yU+6,run,run); olWire([[x,yU+8],[x,yU+11]],run,-1);
    olMachine(x,yU+16,'D',run,run); textC('EDG'+(k+1),x,yU+24,run?'#ffb23a':'#6f8a96',1);
  }
  // legend
  const lx=W-82, ly=yU-6;
  px(lx,ly,5,5,'#ff5a4e'); text('CLOSED',lx+8,ly,'#6f8a96',1);
  rect(lx+38,ly,5,5,'#7cf08f'); text('OPEN',lx+46,ly,'#6f8a96',1);
  px(lx,ly+10,8,1,'#e8cf5a'); text('LIVE',lx+12,ly+8,'#6f8a96',1);
  px(lx+38,ly+10,8,1,'#2f3d47'); text('DEAD',lx+50,ly+8,'#6f8a96',1);
  const srcTxt={UAT:'HOUSE LOAD ON UAT',SST:'HOUSE LOAD ON GRID',EDG:'ON EMERGENCY DIESELS',NONE:'NO HOUSE POWER'}[ax.src];
  text(srcTxt,lx,ly+18,ax.src==='NONE'?(Math.floor(AT*3)%2?'#ff5a4e':'#7a1d18'):ax.src==='EDG'?'#ffb23a':'#9fb3a8',1);
}

function drawGrid(){
  const W=VW, H=VH, nf=nightF(), dk=nf>0.6;
  // the lower band is the station's single-line diagram; the landscape sits above it
  const D=clamp(Math.round(H*0.42),106,150), L=H-D;
  const hy=L-Math.max(70,Math.round(L*0.42)), gy=L-28, gl=L-16;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,L); ctx.clip();
  skyFill(0,hy+1);
  for(let x=0;x<380;x++){ const hh=4+Math.round(Math.sin(x/23)*3+Math.sin(x/9)*1.5); px(x,hy-hh,1,hh+1,dk?'#122017':'#2c4d37') }
  px(0,hy,380,L-hy,dk?'#15251a':'#33603e');
  for(let y=hy+4,k=0;y<gy;y+=5,k++) px(0,y,376,1,k%2?(dk?'#13221a':'#2d5838'):(dk?'#182b1f':'#3a6a45'));
  px(0,hy+3,56,9,dk?'#0d1e2c':'#3b6f8f');
  px(380,hy,W-380,L-hy,dk?'#0a1726':'#2e5f80');
  for(let k=0;k<14;k++){ const wx=384+((k*37+Math.floor(AT*6))%92), wy=hy+4+((k*13)%Math.max(1,L-hy-8)); px(wx,wy,3,1,dk?'#16304a':'#6aa2c4') }
  px(374,hy,7,L-hy,'#c9b98a'); px(380,hy,1,L-hy,'#e6dcb8');
  drawSite(gy,dk);
  // customers and the line out to them
  // each town is lit by its own feeder: from the line, from the backup diesels, or not at all
  const served=S.out.mainS||0, live=S.grid.trip<=0&&S.grid.lineH>0, fsv=S.out.fs||[];
  const litOf=i=>{ const d=feederDem(i); return d>0?clamp((fsv[i]||0)/d,0,1):0 };
  for(let i=0;i<10;i++) settlement(i,S.grid.on[i]&&(fsv[i]||0)>0,litOf(i),gy,hy);
  let far=-1; for(let i=0;i<10;i++) if(S.grid.on[i]) far=i;
  const towers=[[96,0],[114,1],[144,2],[179,3],[220,4],[266,5],[310,6],[344,7],[370,8]];
  let prev=[[90,gy-8],[90,gy-8],[90,gy-8]];
  towers.forEach(([tx,ti])=>{
    const energ=ti<=far;
    const pts=pylon(tx,gl,ti<6?24:22,energ?'#9aa6ae':'#323c44',energ?'#5a646c':'#232a30');
    if(energ){
      for(let k=0;k<3;k++) catenary(prev[k][0],prev[k][1],pts[k][0],pts[k][1],4,live?'#c9d2d9':'#55606a');
      if(live&&served>0){ const q=(AT*0.6+tx*0.013)%1, a=prev[0], b=pts[0];
        px(Math.round(a[0]+(b[0]-a[0])*q),Math.round(a[1]+(b[1]-a[1])*q+16*q*(1-q)),2,1,'#ffe66d') }
    }
    prev=pts;
  });
  if(far>=8) for(let s=0;s<16;s++){ const t=s/16; px(Math.round(372+t*44),Math.round(gl-4-t*(gl-8-hy)),2,1,live?'#7cc8ff':'#3a4d5a') }
  gridHit.length=0;
  for(let i=0;i<10;i++){
    const on=S.grid.on[i], m=feedMode(i), lit=litOf(i);
    const c=!on?'#5a6670':m==='off'?'#8a9aa6':lit>0.97?(m==='edg'?'#ffd27a':'#7cf08f'):lit>0.6?'#ffb23a':'#ff4b45';
    const tw=textW(GRIDN[i],1);
    px(Math.round(GRIDX[i]-tw/2-2),L-12,tw+3,8,'#0a0f13');
    textC(GRIDN[i],GRIDX[i],L-10,c,1);
    const l=i?Math.round((GRIDX[i-1]+GRIDX[i])/2):GRIDX[0]-10, rr=i<9?Math.round((GRIDX[i]+GRIDX[i+1])/2):W;
    const top=i===9?0:i===8||i===6?hy-14:gy-56;
    gridHit.push({i,x:l,y:top,w:rr-l,h:L-top});
  }
  ctx.restore();
  drawOneLine(L,D);
}

/* ======================= VIEW: SUPPLY YARD ======================= */
/* The stores building is open at one end, so its racking shows what is in stock: new
   fuel containers, pallets of canteen supplies and crates of spares. Makeup water lives
   in the demineralised water tank, and its sight glass shows the level. Deliveries come
   up the road, through the barrier, and park at the dock, where the yard crew carries
   each load in by hand and by forklift. Tankers pump straight into the tank. */
function rack(x,y,w,levels,filled,item){
  for(let k=0;k<levels;k++){
    const sy=y-k*11;
    px(x,sy,w,1,'#c96a2a');
    for(let s=0;s<3;s++){ if(k*3+s>=filled) continue;
      const bx=x+2+s*Math.floor((w-4)/3), bw=Math.floor((w-4)/3)-1;
      if(item==='fuel'){ px(bx,sy-5,bw,5,'#9aa6ae'); px(bx,sy-5,1,5,'#f2c23a'); px(bx+bw-1,sy-5,1,5,'#f2c23a'); px(bx,sy-5,bw,1,'#c9d2d9') }
      else if(item==='food'){ px(bx,sy-2,bw,2,'#2e5f86'); px(bx,sy-8,bw,6,'#a8824e'); px(bx+Math.floor(bw/2),sy-8,1,6,'#7a5a32') }
      else { px(bx,sy-7,bw,7,'#8a6a3e'); rect(bx,sy-7,bw,7,'#4a3a22'); px(bx+1,sy-4,bw-2,1,'#4a3a22') }
    }
  }
  px(x,y-levels*11+1,1,levels*11,'#2e5f86'); px(x+w-1,y-levels*11+1,1,levels*11,'#2e5f86');
}
function drawLogi(){

/* The drawing office. The blueprint on the wall is the plant's capacity chain — what the
   core, the cooling, the turbines and the line can each deliver, in electrical
   megawatts on one scale, against what your customers ask for. The shortest bar is the
   one worth spending on. The corkboard carries the hourly ledger. */
function capacityChain(){
  const eff=U('turbe')/100;
  return [
    ['CORE',coreThermalMax()*eff],
    ['COOLING',removalCap()*eff],
    ['TURBINES',turbCap()],
    ['LINE',U('line')]
  ];
}

/* --- HUD --------------------------------------------------------------- */
function stat(label,val,col,title){
  return '<div class="st"'+(title?' title="'+title+'"':'')+'><i>'+label+'</i><b'+(col?' style="color:'+col+'"':'')+'>'+val+'</b></div>';
}
function mwPair(a,b){
  const u=v=>v>=1000?'GW':v>=1?'MW':'kW';
  const f=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1):v>=1?v.toFixed(v>=100?0:1):(v*1000).toFixed(v*1000>=100?0:1);
  return u(a)===u(b)?f(a)+'/'+f(b)+' '+u(b):mw(a)+'/'+mw(b);
}
/* every alarm has a short code (lights an annunciator window) and a plain label (the band) */
function alarmList(){
  const r=S.r,a=[];
  const A=(s,k,t)=>a.push({s,k,t});
  if(S.startup) A('STRT','b','COLD START');
  if(r.temp>1000) A('TEMP','r','CORE OVERHEATING'); else if(r.temp>820) A('TEMP','a','CORE RUNNING HOT');
  if(r.press>pressLimit()) A('PRES','r','OVER PRESSURE'); else if(r.press>pressLimit()*0.88) A('PRES','a','HIGH PRESSURE');
  if(r.coolant<20) A('LEVL','r','LOOP NEARLY DRY'); else if(r.coolant<45) A('LEVL','a','LOW LOOP LEVEL');
  if(r.leak>0) A('LEAK','r','COOLANT LEAK');
  if(r.integ<40) A('CNMT','r','CONTAINMENT FAILING'); else if(r.integ<75) A('CNMT','a','CONTAINMENT DAMAGED');
  if(r.jam>0) A('ROD','r','RODS JAMMED');
  if(liveAssy()===0) A('FUEL','r','NO LIVE FUEL'); else if(S.core.some(x=>x.burn>=100)) A('FUEL','a','SPENT FUEL IN CORE');
  if(coolCap()<S.out.thermal&&S.out.thermal>0.01) A('HEAT','r','HEAT EXCEEDS COOLING');
  else if(settleTemp()>880) A('HEAT','a','SETTLING HOT');
  if(S.grid.trip>0) A('LINE','r','LINE TRIPPED'); else if(S.grid.lineH<55) A('LINE','a','LINE WORN');
  const ax=auxState();
  if(ax.src==='NONE') A('AUX','r','NO HOUSE POWER'); else if(ax.src==='EDG') A('EDG','a','RUNNING ON DIESELS');
  if((S.out.bk||0)<(S.out.bkDem||0)*0.98) A('BKO','a','BACKUP OVERLOADED');
  if(S.out.bypass>0.001&&S.out.served<S.out.demand*0.999) A('CAP','a','LINE AT CAPACITY');
  if(!S.startup&&S.grid.sat<70) A('LOAD','a','CUSTOMERS SHORT');
  if(r.xe>60) A('XENO','a','XENON BUILD-UP');
  if(r.noise>0) A('SCAD','r','INSTRUMENTS COMPROMISED');
  if(S.crew.strike>0) A('CREW','r','WALKOUT');
  else if(!onDuty('ctrl').length) A('PANL','r','PANEL UNMANNED');
  else if(crewCount()&&avgMood()<40) A('CREW','a','LOW MORALE');
  if(S.dock.length&&!onDuty('yard').length) A('DOCK','a','LORRY WAITING');
  if(S.jobs.length&&!onDuty('maint').length) A('MNT','a','NO MAINTENANCE CREW');
  if(S.inv.food<=0) A('FOOD','a','CANTEEN EMPTY');
  if(S.money<0) A('CASH','r','OVERDRAWN');
  for(const e of S.ev.active) A(e.id.slice(0,4),'a',e.name.toUpperCase());
  return a;
}
function drawHud(){
  const r=S.r, tcol=r.temp>1000?'var(--red)':(r.temp>820?'var(--amber)':'var(--green)');
  const net=S.out.income-S.out.spend;
  const satc=S.startup?'var(--blue)':S.grid.sat>90?'var(--green)':(S.grid.sat>60?'var(--amber)':'var(--red)');
  statsEl.innerHTML=
    stat('CASH',money(S.money),S.money<0?'var(--red)':'var(--green)')+
    stat('PER HOUR',(net>=0?'+':'')+money(net),net>=0?'var(--green)':'var(--red)')+
    stat('DAY',S.day+' · '+String(Math.floor(S.hours)).padStart(2,'0')+':'+String(Math.floor(S.hours%1*60)).padStart(2,'0'))+
    stat('SUPPLY / DEMAND',mwPair(S.out.served,S.out.demand),satc,'Colour shows how satisfied your customers are')+
    stat('CORE',num(sensor(r.temp,8))+'°C',tcol)+
    stat('CONTAINMENT',num(r.integ)+'%',r.integ<50?'var(--red)':r.integ<80?'var(--amber)':'var(--ink)')+
    stat('REPUTATION',num(S.rep),'var(--violet)');
  $('stageLbl').textContent=STAGES[plantStage()];
  const all=alarmList();
  DANGER=all.some(a=>a.k==='r');
  $('alarmband').innerHTML=all.slice(0,8).map(a=>'<span class="alm '+a.k+(a.k==='r'?' blink':'')+'">'+(a.t||a.s)+'</span>').join('');
  $('flash').style.opacity=SET.flash?Math.min(0.75,S.flash*0.55):0;
}

    (kind==='bad'?'!! ':kind==='warn'?'! ':'» ')+txt+'</b>');

panel.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!b.dataset.a||b.disabled) return;
  const a=b.dataset.a, i=+b.dataset.i;
  if(a==='scram') scram();

  else if(a==='vent') S.r.vent=S.r.vent>0?0:1;
  else if(a==='top') topUpCoolant();
  else if(a==='seal') sealLeak();
  else if(a==='feed') emergencyFeed();
  else if(a==='pumpfix') repairPump(i);
  else if(a==='allpump'){ const v=+b.dataset.d; for(let k=0;k<U('loops');k++) S.pumps[k].s=v; setSliders() }
  else if(a==='assy') replaceAssembly(i);
  else if(a==='refuelall'){ for(let k=0;k<S.core.length;k++) if((!S.core[k].on||S.core[k].burn>=100)&&S.inv.fuel>0) replaceAssembly(k) }
  else if(a==='integ') overhaulCore();
  else if(a==='ton') S.turbs[i].on=!S.turbs[i].on;
  else if(a==='tfix') repairTurb(i);
  else if(a==='tsell') sellTurbine(i);
  else if(a==='tbuy') buyTurbine(i);
  else if(a==='conn') connectTier(i);
  else if(a==='fdr') setFeeder(i,b.dataset.g);
  else if(a==='linefix') repairLine();
  else if(a==='order') order(b.dataset.g,+b.dataset.d);
  else if(a==='hireW') hireWorker(i);
  else if(a==='sack') dismissWorker(i);
  else if(a==='duty') setDuty(i,b.dataset.g);
  else if(a==='up') buyUpgrade(b.dataset.g);
  else if(a==='sub') SUPTAB=b.dataset.g;
  else if(a==='view') setView(b.dataset.g);
  buildPanel();
});
function setSliders(){
  const rs=$('rodS'); if(rs) rs.value=Math.round(S.r.rods);
  for(let i=0;i<6;i++){ const e=$('pmp'+i); if(e) e.value=Math.round(S.pumps[i].s) }

function buildPanel(){

    setL('p',num(sensor(r.press,2))+' / '+num(pressLimit())+' bar',r.press>pressLimit()*0.9?'var(--red)':'');
    setL('xe',num(r.xe),r.xe>50?'var(--amber)':'');
    setL('dh',num((r.decay||0)*100,1)+'% of rating');
    const cap=coolCap(), th=S.out.thermal, f=cap>0?th/cap:1;
    setL('hb',mw(th)+' of '+mw(cap),f>1?'var(--red)':f>0.9?'var(--amber)':'');
    setBar('hb',f,f>1?'var(--red)':f>0.9?'var(--amber)':'var(--green)');
    const st=settleTemp();
    setL('settle',st>=2599?'RUNAWAY':num(st)+' °C',st>1000?'var(--red)':st>820?'var(--amber)':'var(--green)');
    setL('lvl',num(r.coolant)+'%',r.coolant<30?'var(--red)':'');
    setBar('lvl',r.coolant/100,r.coolant<30?'var(--red)':'var(--blue)');
    sig($('jam'),String(r.jam>0),r.jam>0?'<div class="hint" style="color:var(--red);margin-top:4px">Rod drive jammed — the rods will not move until it frees.</div>':'');
    sig($('situ'),S.ev.active.map(e=>e.id+num(e.until)).join()+'|'+num(r.noise),situHtml());
  };
}
function situHtml(){
  let h='';
  for(const e of S.ev.active) h+='<div class="row"><span class="k" style="color:var(--amber)">'+e.name+'</span><span>'+num(e.until)+'h left</span></div>';
  if(S.r.noise>0) h+='<div class="row"><span class="k" style="color:var(--red)">Instruments compromised</span><span>'+num(S.r.noise)+'h left</span></div>';
  return h||'<div class="no">Nothing out of the ordinary.</div>';
}

/* --- canvas clicks ----------------------------------------------------- */
cv.addEventListener('click',e=>{
  const rb=cv.getBoundingClientRect();
  const scale=Math.min(rb.width/VW,rb.height/VH);
  const ox=(rb.width-VW*scale)/2, oy=(rb.height-VH*scale)/2;
  const x=(e.clientX-rb.left-ox)/scale, y=(e.clientY-rb.top-oy)/scale;
  const inside=h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h;
  if(S.view==='core'){
    for(const hh of coreHit) if(inside({x:hh.x-1,y:hh.y,w:hh.w+2,h:hh.h})){
      const sp=hh.idxs.find(k=>!S.core[k].on||S.core[k].burn>=100);
      if(sp!==undefined) replaceAssembly(sp);
      else { const b=hh.idxs.reduce((s,k)=>s+S.core[k].burn,0)/Math.max(1,hh.idxs.length);
        logMsg('Positions '+(hh.idxs[0]+1)+(hh.idxs.length>1?'–'+(hh.idxs[hh.idxs.length-1]+1):'')+': '+num(b)+'% burnt up on average, still producing.','info') }
      buildPanel(); return;
    }
  } else if(S.view==='turb'){
    for(const hh of turbHit) if(inside(hh)){
      const t=S.turbs[hh.i]; t.on=!t.on;
      logMsg(TURBS[t.m].name+' (set '+(hh.i+1)+')'+(t.on?' brought online.':' taken offline.'),'info');
      buildPanel(); return;
    }
  } else if(S.view==='grid'){
    for(const hh of gridHit) if(inside(hh)){
      if(!S.grid.on[hh.i]) connectTier(hh.i);
      else logMsg(TIERS[hh.i].name+' — '+TIERS[hh.i].w+', '+mw(TIERS[hh.i].demand)+' at '+money(TIERS[hh.i].rate)+'/MWh.','info');
      buildPanel(); return;
    }
  } else if(S.view==='ctrl'){
    if(ctrlHit&&inside(ctrlHit)) scram();
  }
});
