/* Everything here is synthesised — no audio files. The ambience is a handful of
   layers whose gains and frequencies follow the plant, and the music is a slow
   generative pad that darkens when the alarms light up. */
const SET={master:0.7,music:0.45,amb:0.6,sfx:0.8,mute:false,shake:true,scan:true,flash:true};
function loadSettings(){
  try{ const s=JSON.parse(localStorage.getItem('neuclify.settings')||'null');
    if(s&&typeof s==='object') for(const k in SET) if(k in s) SET[k]=s[k];
  }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem('neuclify.settings',JSON.stringify(SET)) }catch(e){} }

const AU={ctx:null,ok:false,layers:{},chordT:0,chord:0,clickT:0,klaxT:0};
let DANGER=false;

function audioStart(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume().catch(()=>{}); return }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C(); AU.ctx=ctx;
    AU.master=ctx.createGain(); AU.master.connect(ctx.destination);
    AU.busAmb=ctx.createGain(); AU.busAmb.connect(AU.master);
    AU.busMus=ctx.createGain(); AU.busMus.connect(AU.master);
    AU.busSfx=ctx.createGain(); AU.busSfx.connect(AU.master);
    const len=Math.floor(ctx.sampleRate*2), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+w*0.1)*0.96; d[i]=w*0.6+last }
    AU.noise=buf;
    AU.layers.rumble=noiseLayer('lowpass',110,1);
    AU.layers.steam =noiseLayer('highpass',2400,0.7);
    AU.layers.wind  =noiseLayer('bandpass',440,0.8);
    AU.layers.hum   =oscLayer('sawtooth',54,'lowpass',240);
    AU.layers.mains =oscLayer('sine',100,null,0);
    AU.layers.whine =oscLayer('triangle',420,'lowpass',2800);
    AU.ok=true; applyAudio();
  }catch(e){ AU.ok=false }
}
function noiseLayer(type,freq,q){
  const ctx=AU.ctx, src=ctx.createBufferSource();
  src.buffer=AU.noise; src.loop=true;
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=ctx.createGain(); g.gain.value=0;
  src.connect(f); f.connect(g); g.connect(AU.busAmb);
  try{src.start()}catch(e){}
  return {g,f};
}
function oscLayer(type,freq,ftype,ffreq){
  const ctx=AU.ctx, o=ctx.createOscillator();
  o.type=type; o.frequency.value=freq;
  let node=o, f=null;
  if(ftype){ f=ctx.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq; o.connect(f); node=f }
  const g=ctx.createGain(); g.gain.value=0;
  node.connect(g); g.connect(AU.busAmb);
  try{o.start()}catch(e){}
  return {g,o,f};
}
function applyAudio(){
  if(!AU.ok) return;
  const m=SET.mute?0:SET.master;
  AU.master.gain.value=m;
  AU.busAmb.gain.value=SET.amb;
  AU.busMus.gain.value=SET.music;
  AU.busSfx.gain.value=SET.sfx;
}
/* one-shot voices ------------------------------------------------------ */
function tone(freq,len,type,vol,bus){
  if(!AU.ok) return;
  try{
    const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.06),ctx.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+len);
    o.connect(g); g.connect(bus||AU.busSfx);
    o.start(); o.stop(ctx.currentTime+len+0.05);
  }catch(e){}
}
function noiseBurst(freq,len,vol){
  if(!AU.ok) return;
  try{
    const ctx=AU.ctx, s=ctx.createBufferSource(); s.buffer=AU.noise;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=6;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol||0.05,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+len);
    s.connect(f); f.connect(g); g.connect(AU.busSfx);
    s.start(); s.stop(ctx.currentTime+len+0.05);
  }catch(e){}
}
function beep(freq,len){ tone(freq,len||0.1,'square',0.07) }
function padNote(freq,len,vol,type){
  if(!AU.ok) return;
  try{
    const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type=type||'triangle'; o.frequency.value=freq;
    o.detune.value=rnd(-7,7);
    f.type='lowpass'; f.frequency.value=900;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),ctx.currentTime+len*0.35);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+len);
    o.connect(f); f.connect(g); g.connect(AU.busMus);
    o.start(); o.stop(ctx.currentTime+len+0.1);
  }catch(e){}
}
function pluck(freq){
  if(!AU.ok) return;
  try{
    const ctx=AU.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1.6);
    o.connect(g); g.connect(AU.busMus);
    o.start(); o.stop(ctx.currentTime+1.7);
  }catch(e){}
}
/* generative score ----------------------------------------------------- */
const PENT=[0,3,5,7,10];
const PROG=[[0,3,7],[-4,0,3],[-2,2,5],[-5,-1,2]];
const PROG_DARK=[[0,3,6],[-1,2,6],[0,1,7],[-3,0,6]];
function musicTick(dt){
  if(!AU.ok||SET.music<=0||SET.mute) return;
  AU.chordT-=dt;
  if(AU.chordT>0) return;
  const dark=DANGER&&S&&!S.over;
  AU.chordT=dark?4.6:8.5;
  const prog=dark?PROG_DARK:PROG;
  const ch=prog[AU.chord%prog.length]; AU.chord++;
  const root=dark?103.8:110;
  ch.forEach((semi,i)=>padNote(root*Math.pow(2,semi/12),AU.chordT*1.3,0.045-i*0.009));
  padNote(root*Math.pow(2,(ch[0]-12)/12),AU.chordT*1.15,0.06,'sine');
  if(Math.random()<(dark?0.5:0.7)){
    const n=PENT[ri(0,PENT.length-1)]+(Math.random()<0.4?12:0);
    setTimeout(()=>pluck(root*2*Math.pow(2,n/12)),ri(150,2400));
  }
}
/* ambience ------------------------------------------------------------- */
function audioTick(dt){
  if(!AU.ok) return;
  musicTick(dt);
  if(!S){ for(const k in AU.layers) AU.layers[k].g.gain.value*=0.9; return }
  const L=AU.layers, r=S.r;
  const heat=clamp((r.temp-100)/950,0,1);
  const flux=clamp(r.flux/100,0,1.6);
  const spin=clamp(S.out.gross/Math.max(0.001,turbCap()),0,1);
  const quiet=(S.paused||ovOpen)?0.25:1;
  const v=S.view;
  const t={rumble:0,steam:0,wind:0,hum:0,mains:0,whine:0};
  if(v==='ctrl'){ t.hum=0.09+0.09*heat; t.mains=0.05; t.rumble=0.05+0.09*flux; t.whine=0.012*spin }
  else if(v==='core'){ t.rumble=0.13+0.2*flux; t.steam=0.04+0.13*heat; t.hum=0.07 }
  else if(v==='turb'){ t.whine=0.04+0.15*spin; t.steam=0.05+0.09*spin; t.mains=0.06; t.rumble=0.04 }
  else if(v==='grid'){ t.wind=0.1; t.mains=0.04+0.04*clamp(S.out.served/Math.max(0.001,S.out.demand),0,1) }
  else if(v==='logi'){ t.wind=0.12; t.rumble=0.03 }
  else { t.hum=0.04; t.wind=0.03 }
  if(S.over) { t.rumble=0.2; t.steam=0.14; t.hum=0; t.whine=0; t.mains=0 }
  try{
    L.whine.o.frequency.value=300+700*spin;
    L.hum.o.frequency.value=52+12*heat;
    L.rumble.f.frequency.value=85+80*flux;
    L.wind.f.frequency.value=380+90*Math.sin(S.t*0.21);
  }catch(e){}
  const k=clamp(dt*2.2,0,1);
  for(const key in t) L[key].g.gain.value=lerp(L[key].g.gain.value,t[key]*quiet,k);
  // incidental one-shots
  AU.clickT-=dt;
  if(AU.clickT<=0){
    AU.clickT=0.04+Math.random()*0.5;
    if(!S.paused&&!ovOpen){
      if(v==='core'&&flux>0.02&&Math.random()<clamp(flux*0.8,0,0.9)) noiseBurst(2600+Math.random()*2600,0.03,0.025);
      else if(v==='ctrl'&&Math.random()<0.05) noiseBurst(1100,0.04,0.02);
      else if(v==='logi'&&Math.random()<0.025) tone(680,0.09,'square',0.03);
      else if(v==='turb'&&Math.random()<0.03) noiseBurst(300,0.12,0.02);
    }
  }
  // alarm klaxon
  AU.klaxT-=dt;
  if(DANGER&&!S.over&&!S.paused&&!ovOpen&&AU.klaxT<=0){
    AU.klaxT=1.9;
    tone(466,0.34,'square',0.05);
    setTimeout(()=>tone(349,0.34,'square',0.05),370);
  }
}

/* --- history for the CRT traces --- */
function histInit(){ S.hist={flux:[],temp:[],press:[],out:[],dem:[]} }
let histT=0;
function histPush(dt){
  histT+=dt; if(histT<0.28) return; histT=0;
  const h=S.hist, keep=100;
  h.flux.push(S.r.flux); h.temp.push(S.r.temp); h.press.push(S.r.press);
  // sent out, not sold: so a surplus shows above the demand line instead of hiding on it
  h.out.push((S.out.deliv||0)+(S.out.bk||0)); h.dem.push(S.out.demand);
  for(const k in h) if(h[k].length>keep) h[k].shift();
}

   '<p>The plant is still yours. Keep running it, push the output higher, or just sit with the hum for a while.</p>'+
   finalStats()+
   '<div class="acts"><button class="b-go" data-o="keep">KEEP RUNNING THE PLANT</button></div>');
}

/* --- save / load --- */
const SKEY='neuclify.save.v3';
function saveGame(){
  if(!S||S.over) return;
  try{ localStorage.setItem(SKEY,JSON.stringify({S:S,v:1})) }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem(SKEY) }catch(e){ return false } }
function clearSave(){ try{ localStorage.removeItem(SKEY) }catch(e){} }
function loadGame(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(SKEY)) }catch(e){}
  if(!d||!d.S){ startNew(); return }
  S=d.S;
  S.jobs=[];                                   // closures do not survive storage
  S.ev.active=(S.ev.active||[]).filter(e=>e.id!=='heat'&&e.id!=='flood');
  S.r.inlet=34; S.over=null; S.paused=false;
  if(typeof S.r.decay!=='number') S.r.decay=0;
  if(typeof S.startup!=='boolean') S.startup=false;
  if(!S.dock) S.dock=[];
  // rod automation was withdrawn: refund anyone who bought it
  if(S.up.auto>0){ const c=[0,8000,150000]; let back=0; for(let k=1;k<=S.up.auto;k++) back+=(c[k]||0)*COSTX;
    S.money+=back; logMsg('Rod automation has been withdrawn. '+money(back)+' refunded.','info'); }
  delete S.up.auto; delete S.autoTemp;
  if(!S.grid.fd) S.grid.fd=S.grid.on.map(on=>on?'main':'off');
  if(!S.crew||!S.crew.workers){ S.crew={workers:[],pool:[],poolT:0,strike:0}; refreshPool(); }
  if(!S.crew.pool||!S.crew.pool.length) refreshPool();
  for(const w of S.crew.workers) WID=Math.max(WID,w.id);
  if(!S.hist) histInit();
  if(!S.out) S.out={gross:0,net:0,deliv:0,demand:0,served:0,thermal:0,cool:0,cap:0,parasite:0,spill:0,income:0,spend:0};
  boot();
  logMsg('Shift resumed on day '+S.day+'.','info');
}
function startNew(){ newGame(); histInit(); boot(); }
function boot(){
  ovHome=null; tickQueue=[];
  buildTabs(); setView(S.view||'ctrl'); drawHud();
  $('bSpeed').textContent=S.speed+'x';
  $('bPause').textContent=S.paused?'>':'II';
}

/* --- hud buttons --- */
$('bSpeed').addEventListener('click',()=>{
  const order=[1,2,4,8]; S.speed=order[(order.indexOf(S.speed)+1)%order.length];
  $('bSpeed').textContent=S.speed+'x';
});
$('bPause').addEventListener('click',()=>{ S.paused=!S.paused; $('bPause').textContent=S.paused?'>':'II' });
$('bHelp').addEventListener('click',()=>{ if(S) S.paused=true; showHelp() });
$('bSet').addEventListener('click',()=>{ if(S) S.paused=true; showSettings() });
/* the browser will not let any of this make a sound until the player touches the page */
addEventListener('pointerdown',audioStart,{once:false});
addEventListener('keydown',audioStart,{once:false});

/* --- keyboard --- */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(ovOpen){ if(k==='escape') backFromOverlay(); return }
  if(!S) return;
  const vi=['1','2','3','4','5','6'].indexOf(e.key);
  if(vi>=0){ setView(VIEWS[vi].id); e.preventDefault(); return }
  if(k===' '){ S.paused=!S.paused; $('bPause').textContent=S.paused?'>':'II'; e.preventDefault() }
  else if(k==='s') scram();
  else if(k==='h'){ S.paused=true; showHelp() }
  else if(k==='o'){ S.paused=true; showSettings() }
  else if(k==='m'){ SET.mute=!SET.mute; if(!SET.mute) audioStart(); applyAudio(); saveSettings();
    logMsg('Sound '+(SET.mute?'muted.':'on.'),'info') }
  else if(k==='arrowup'||k==='arrowdown'){
    if(S.r.jam<=0&&S.r.scramT<=0){ S.r.rods=clamp(S.r.rods+(k==='arrowup'?-2:2),0,100); setSliders() }
    e.preventDefault();
  }
  else if(k===','||k==='<'){ S.speed=Math.max(1,S.speed/2); $('bSpeed').textContent=S.speed+'x' }
  else if(k==='.'||k==='>'){ S.speed=Math.min(8,S.speed*2); $('bSpeed').textContent=S.speed+'x' }
});
addEventListener('visibilitychange',()=>{ if(document.hidden&&S&&!S.over) saveGame() });

/* --- main loop --- */
let prev=performance.now(), hudT=0, panelT=0, saveT=0;
function frame(now){
  const dt=Math.min(0.1,(now-prev)/1000); prev=now;
  if(S){
    if(!S.paused&&!ovOpen&&!S.over){
      const total=dt*S.speed;
      const n=Math.min(24,Math.max(1,Math.ceil(total/0.05)));
      for(let i=0;i<n;i++) step(dt/n);
      histPush(dt*S.speed);
    }
    render(dt);
    hudT+=dt; if(hudT>0.12){ hudT=0; drawHud() }
    panelT+=dt; if(panelT>0.14){ panelT=0; if(PANEL.up){ try{PANEL.up()}catch(e){} } }
    saveT+=dt; if(saveT>20){ saveT=0; saveGame() }
  }
  audioTick(dt);
  requestAnimationFrame(frame);
}

/* --- live-update support: keep the shift running across a republish --- */
loadSettings(); applyVisualSettings();
/* keep the canvas the shape of the stage so scenes fill it instead of letterboxing */
fitCanvas();
try{ if(window.ResizeObserver) new ResizeObserver(fitCanvas).observe($('canwrap')); }catch(e){}
addEventListener('resize',fitCanvas);
try{
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot) hot.snapshot(()=>({save:S?JSON.stringify(S):null}));
  const start=data=>{
    if(data&&data.save){
      try{ S=JSON.parse(data.save); S.jobs=[]; if(!S.hist) histInit(); boot(); }
      catch(e){ showTitle() }
    } else showTitle();
    requestAnimationFrame(frame);
  };
  if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data);
}catch(e){ showTitle(); requestAnimationFrame(frame) }

})();
</script>
